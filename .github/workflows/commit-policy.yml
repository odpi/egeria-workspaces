name: Commit Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

jobs:
  commit-policy:
    # Dependabot's bot commits never carry a Signed-off-by trailer (it has no
    # mechanism to add one), so this DCO check would fail every single
    # dependency-bump PR on arrival with no path to a green run short of
    # manually amending and force-pushing each one. Skip the check entirely
    # for dependabot PRs -- DCO stays strictly enforced for human-authored
    # commits, which is what it exists to attest.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Least-privilege (OpenSSF Scorecard Token-Permissions): this job only
    # checks out the PR's commit history and reads it -- never writes
    # anything back to the repo.
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate commit messages and signoff
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SUBJECT_REGEX='^.+$'
          echo "Checking commits in range: ${BASE_SHA}..${HEAD_SHA}"

          failures=0

          while IFS= read -r commit; do
            [ -z "$commit" ] && continue

            subject="$(git log -1 --pretty=%s "$commit")"
            body="$(git log -1 --pretty=%B "$commit")"

            if ! printf '%s\n' "$subject" | grep -Eq "$SUBJECT_REGEX"; then
              echo "::error::Commit ${commit} has invalid subject: ${subject}"
              failures=$((failures + 1))
            fi

            if ! printf '%s\n' "$body" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit ${commit} is missing Signed-off-by trailer"
              failures=$((failures + 1))
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")

          if [ "$failures" -gt 0 ]; then
            echo "\nCommit policy failed. Use: git commit -s -m \"type(scope): short summary\""
            exit 1
          fi

          echo "Commit policy passed."

