name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PyegeriaWebHandler Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'compose-configs/egeria-quickstart/PyegeriaWebHandler/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r compose-configs/egeria-quickstart/PyegeriaWebHandler/requirements.txt
        pip install pytest pytest-asyncio

    - name: Run Quickstart Handler tests
      run: |
        pytest compose-configs/egeria-quickstart/PyegeriaWebHandler/tests/test_fastapi_handler_health.py compose-configs/egeria-quickstart/PyegeriaWebHandler/tests/test_mcp_server_basic.py

    - name: Run Freshstart Handler tests
      run: |
        pytest compose-configs/egeria-freshstart/PyegeriaWebHandler/tests/test_fastapi_handler_health.py compose-configs/egeria-freshstart/PyegeriaWebHandler/tests/test_mcp_server_basic.py
