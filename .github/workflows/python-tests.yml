name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PyegeriaWebHandler Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'compose-configs/egeria-quickstart/PyegeriaWebHandler/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r compose-configs/egeria-quickstart/PyegeriaWebHandler/requirements.txt
        pip install pytest pytest-asyncio

    - name: Guard against a default Postgres password in compose files (trellis TR-12)
      run: |
        pytest tests/test_no_default_pg_password.py

    - name: Guard against drift between the Portal files quickstart and freshstart share (SHARE-3)
      run: |
        pytest tests/test_shared_portal_files.py

    - name: Guard that every served page initialises mermaid with securityLevel 'strict'
      run: |
        pytest tests/test_mermaid_security_level.py

    - name: Demo Portal token route accepts a sent password only with a demo persona's user name
      run: |
        pytest compose-configs/egeria-quickstart/PyegeriaWebHandler/tests/test_demo_token_persona_only.py
        pytest compose-configs/egeria-freshstart/PyegeriaWebHandler/tests/test_demo_token_persona_only.py

    - name: Run Quickstart Handler tests
      run: |
        pytest compose-configs/egeria-quickstart/PyegeriaWebHandler/tests/test_fastapi_handler_health.py compose-configs/egeria-quickstart/PyegeriaWebHandler/tests/test_mcp_server_basic.py

    - name: Run Freshstart Handler tests
      run: |
        pytest compose-configs/egeria-freshstart/PyegeriaWebHandler/tests/test_fastapi_handler_health.py compose-configs/egeria-freshstart/PyegeriaWebHandler/tests/test_mcp_server_basic.py
