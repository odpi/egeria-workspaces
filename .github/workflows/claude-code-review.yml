name: Claude Code Review

# DISABLED (2026-08-21): automatic runs are turned off; this is manual-only.
#
# Every run fails during claude-code-action's app-token exchange:
#
#   App token exchange failed: 401 Unauthorized - Invalid OIDC token
#   ##[error]Action failed with error: Invalid OIDC token
#
# It dies while authenticating, before reviewing any code, so the resulting red
# X carries no information about the change under review. The switch to
# pull_request_target described below was an attempt to fix exactly this and did
# not resolve it; the remaining failure has been diagnosed as being on
# Anthropic's side, not something this repo can configure around.
#
# Why disable rather than leave it failing: this is not a required check
# (branch protection on main requires only DCO), so it never blocked a merge --
# it just painted every single PR red. Observed 4/4 failures on PR #367. A check
# that always fails trains reviewers to ignore CI, which is worse than no check,
# because a genuine failure stops standing out.
#
# To re-enable once the upstream issue is fixed: delete the workflow_dispatch
# trigger below and uncomment the pull_request_target block. The safety
# reasoning for pull_request_target is preserved below and still applies.
#
# ---------------------------------------------------------------------------
#
# pull_request_target (not pull_request): PRs from forks are the common case
# for this repo, and GitHub unconditionally blocks OIDC token issuance
# (id-token: write, which claude-code-action needs to post review comments)
# for pull_request-triggered runs originating from a fork -- no permissions
# block or repo/org setting can override that, regardless of what's declared
# below. pull_request_target runs the workflow from the base branch instead
# (trusted, not fork-controlled) and does get OIDC/token access even when
# the PR itself is from a fork.
#
# Safety: this job never checks out or executes the PR's own code -- the
# checkout step below defaults to the base ref (safe), and the actual review
# is done by claude-code-action reading the PR diff via the GitHub API, not
# by running anything from the fork. Do not add `ref:
# ${{ github.event.pull_request.head.sha }}` to the checkout step (or run
# any build/test/install step against fork code) without re-evaluating this
# safety argument -- that's the actual risk pull_request_target introduces.
on:
  # Manual-only while the OIDC failure above is unresolved. Run from the Actions
  # tab if you want to try it against a specific branch.
  workflow_dispatch:
  # Re-enable by uncommenting this block and removing workflow_dispatch above.
  # pull_request_target:
  #   types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

