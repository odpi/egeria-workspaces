name: Claude Code Review

# pull_request_target (not pull_request): PRs from forks are the common case
# for this repo, and GitHub unconditionally blocks OIDC token issuance
# (id-token: write, which claude-code-action needs to post review comments)
# for pull_request-triggered runs originating from a fork -- no permissions
# block or repo/org setting can override that, regardless of what's declared
# below. pull_request_target runs the workflow from the base branch instead
# (trusted, not fork-controlled) and does get OIDC/token access even when
# the PR itself is from a fork.
#
# Safety: this job never checks out or executes the PR's own code -- the
# checkout step below defaults to the base ref (safe), and the actual review
# is done by claude-code-action reading the PR diff via the GitHub API, not
# by running anything from the fork. Do not add `ref:
# ${{ github.event.pull_request.head.sha }}` to the checkout step (or run
# any build/test/install step against fork code) without re-evaluating this
# safety argument -- that's the actual risk pull_request_target introduces.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

