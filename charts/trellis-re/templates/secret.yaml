{{- $cfg := include "trellis-re.cfg" . | fromYaml -}}
{{- if $cfg.createSecret }}
# DEMO ONLY (the production posture refuses to render without secrets.existingSecret).
# Random values, kept across upgrades (lookup). Every pod must share them: sessions and stored DB credentials
# are keyed on them.
{{- $existing := lookup "v1" "Secret" .Release.Namespace $cfg.secretName }}
{{- $jwt := randAlphaNum 48 | b64enc }}
{{- $key := randAlphaNum 32 | b64enc }}
{{- if $existing }}
{{- $jwt = default $jwt (get $existing.data "jwt-secret") }}
{{- $key = default $key (get $existing.data "db-credential-key") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.secretName }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "re") | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ $jwt }}
  db-credential-key: {{ $key }}
{{- end }}
