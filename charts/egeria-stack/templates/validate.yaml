{{- /* The two parts must agree. A mismatch would start a Portal for one environment against the other's platform. */ -}}
{{- $env := .Values.environment -}}
{{- if not (has $env (list "quickstart" "freshstart")) -}}
{{- fail (printf "environment must be quickstart or freshstart, not %q (set environment)" $env) -}}
{{- end -}}
{{- if not (has .Values.posture (list "demo" "production")) -}}
{{- fail (printf "posture must be demo or production, not %q (use values-demo.yaml or values-production.yaml)" .Values.posture) -}}
{{- end -}}
{{- if and .Values.core.enabled .Values.portal.enabled -}}
{{- if ne (toString .Values.core.environment) $env -}}
{{- fail (printf "core.environment is %q but environment is %q: set environment once, with --set environment=... and --set core.environment=... %s" (toString .Values.core.environment) $env "to the same value (the umbrella cannot set a subchart's values for you)") -}}
{{- end -}}
{{- if ne (toString .Values.portal.environment) $env -}}
{{- fail (printf "portal.environment is %q but environment is %q: set portal.environment to the same value" (toString .Values.portal.environment) $env) -}}
{{- end -}}
{{- if ne (toString .Values.core.posture) (toString .Values.portal.posture) -}}
{{- fail (printf "core.posture is %q but portal.posture is %q: both parts use the same posture" (toString .Values.core.posture) (toString .Values.portal.posture)) -}}
{{- end -}}
{{- if and .Values.portal.platform.serviceName (ne .Values.portal.platform.serviceName (printf "%s-platform" .Release.Name)) -}}
{{- fail (printf "portal.platform.serviceName is %q but this release's platform Service is %q: leave it empty" .Values.portal.platform.serviceName (printf "%s-platform" .Release.Name)) -}}
{{- end -}}
{{- end -}}
