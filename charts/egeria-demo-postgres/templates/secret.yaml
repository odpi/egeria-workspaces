{{- /* The superuser password is random, created once and kept across upgrades. */ -}}
{{- $name := printf "%s-superuser" (include "egeria-demo-postgres.name" .) -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "egeria-demo-postgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ if $old }}{{ index $old.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
