    DocumentRoot "/usr/local/apache2/htdocs"
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    RedirectMatch ^/$ /portal

    Alias /local /usr/local/apache2/htdocs/local
    <Directory "/usr/local/apache2/htdocs/local">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # All proxy routes — shared with the HTTP vhost via proxy-locations.conf.
    # Add new routes there, not here.
    Include conf/extra/proxy-locations.conf

    # Gated JupyterLab/Obsidian routes -- HTTPS only, and only mounted in demo
    # mode (egeria-quickstart-demo.yaml); absent otherwise.
    IncludeOptional conf/extra/workbench-locations.conf
