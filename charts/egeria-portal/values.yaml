# egeria-portal: pyegeria-web plus the Apache front door. Compose is the source of truth for the
# environment's settings; charts/tests/drift_test.py checks the copies in files/.

global:
  # true: no runAsUser/runAsGroup/fsGroup (restricted-v2 assigns the UID, GID 0).
  openshift: false
  # Pull Secrets for every pod (in egeria-stack, set once here for all parts): Secret names or {name: ...}.
  imagePullSecrets: []

# quickstart | freshstart. Picks the platform port, the view server, the Egeria user and the demo password.
environment: quickstart
# demo | production. Normally set by values-demo.yaml or values-production.yaml.
posture: demo

# One Portal pod: its state is files and sqlite on one volume. The chart refuses more.
replicas: 1

platform:
  # REQUIRED. The Service of the egeria-platform release in this namespace, usually <release>-platform.
  serviceName: ""
  # Empty means the environment's port: 9443 (quickstart) or 8443 (freshstart).
  port: ""
  # Empty means the environment's view server: qs-view-server or fs-view-server.
  viewServer: ""
  # Freshstart's Portal reads the platform's application.properties and user directory (compose mounts them).
  # Empty means <platform.serviceName>-properties (ConfigMap) and <platform.serviceName>-secrets (Secret), the
  # egeria-platform chart's own names. Both mounts are optional.
  propertiesConfigMap: ""
  # REQUIRED for a production freshstart Portal: the platform chart creates <platform.serviceName>-secrets only in the demo
  # posture, so name the platform's own Secret (usually the same as the platform's secrets.existingSecret). The chart refuses without it.
  userDirectorySecret: ""

egeria:
  # Empty means the environment's Egeria user for the Portal: erinoverview (quickstart) or bootstrap (freshstart).
  userId: ""

secrets:
  # A Secret with keys jwt-secret, egeria-user-password and mcp-access-token. Required in production.
  # Empty in the demo posture: the chart creates one (random jwt-secret and token, kept across upgrades;
  # the Egeria password is the public demo one from the tracked files).
  existingSecret: ""

tls:
  # Whether the Portal checks the platform's certificate. The demo certificate is self-signed.
  verify: false
  # Production: a Secret with key ca.crt (PEM) to verify the platform's certificate against.
  caSecret: ""

images:
  portal:
    repository: ""     # for example localhost:5001/portal-quickstart
    tag: ""
    digest: ""         # required in production
    pullPolicy: IfNotPresent
  apache:
    repository: ""     # for example localhost:5001/apache-web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

# PORTAL_TRUSTED_PROXIES (PO-83): the peers whose X-Forwarded-For the Portal believes, so its auth rate limits count per real client IP. Comma-separated
# IPs, CIDRs and hostnames, re-resolved every 60 s. Empty means the headless Service of the Apache pods (<release>-portal-web-hl.<namespace>.svc.cluster.local),
# which is right whenever Apache is the only thing that reaches the Portal (the NetworkPolicy the chart requires with an Ingress). Setting it REPLACES that
# default (for example a pod CIDR); never use 0.0.0.0/0: a NetworkPolicy gap would become a rate-limit bypass. Your cluster domain is not cluster.local? Set it here.
trustedProxies: ""
# Behind an Ingress controller the peer Apache sees is the controller. PO-83 walks X-Forwarded-For past EVERY trusted hop, so adding the controller's range here
# (an IP or CIDR, comma-separated; it is ADDED to the list above) makes limits count per real client instead of one shared budget for everyone behind the
# controller. Keep it NARROW: the controller's own pods or namespace range, never the pod network (the chart refuses /0 and anything wider than /16 for IPv4).
ingressControllerCidr: ""
demoMode: false          # the public-demo login gate and registration; see the Portal's demo-mode.md
# A quickstart Portal behind an Ingress with demoMode=false has no login gate (local mode: anyone reaches the Portal as its
# service user). The chart refuses that unless this is true. Demo posture only; NOTES warns.
allowUngatedPortal: false
siteUrl: ""              # SITE_URL: the external URL (links in emails)
# Additional environment entries for the Portal container. The chart refuses names it owns (EGERIA_ROOT_PATH,
# DEMO_MODE, SERVER_MANAGED_AUTH, JWT_SECRET, EGERIA_USER_PASSWORD, MCP_ACCESS_TOKEN, EGERIA_USER, PORTAL_ALLOWED_PLATFORM_URLS).
extraEnv: []

securityContext:
  runAsUser: 1001
  runAsGroup: 0
  fsGroup: 0

persistence:
  size: 2Gi
  storageClassName: ""
  existingClaim: ""      # one volume: state (~/.pyegeria), demo-data and the Dr.Egeria inbox and outbox, in sub-directories

# Content compose mounts (README-portal-images.md). Each is an existing PVC; empty means an empty directory.
content:
  config: {existingClaim: ""}
  work: {existingClaim: ""}
  cocoWorkbooks: {existingClaim: ""}
  designPatterns: {existingClaim: ""}
  templates: {existingClaim: ""}
  cocoDags: {existingClaim: ""}
# The platform's data exchange folders, read-only (the platform chart's exchange claims).
exchange:
  loadingBay: {existingClaim: ""}
  landingArea: {existingClaim: ""}
  cocoDataLake: {existingClaim: ""}
  distributionHub: {existingClaim: ""}
  treasuryDtsHistory: {existingClaim: ""}

resources:
  portal:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  apache:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Probe timings (the checks themselves are fixed: GET / for the Portal, TCP 8085 for Apache). Only initialDelaySeconds,
# periodSeconds, timeoutSeconds, failureThreshold and successThreshold may be set.
probes:
  portal:
    startup: {periodSeconds: 10, failureThreshold: 60}
    readiness: {periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3}
    liveness: {periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 5}
  apache:
    readiness: {periodSeconds: 10}
    liveness: {periodSeconds: 30, failureThreshold: 5}

canary:
  # helm test signs in with this non-personal account ({user_id, password}), never as the Portal's own user.
  # Keys userId and password. Required for helm test in production; the demo posture makes one from the tracked demo files.
  existingSecret: ""

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}

networkPolicy:
  enabled: false
  # Added to the Portal pod so the platform's NetworkPolicy (clientLabel) lets it in.
  platformClientLabel: egeria.odpi.org/client

# Pod identity, for every pod of this chart (test pods too). serviceAccountName names an existing ServiceAccount (the chart
# creates none; empty means the namespace's default). imagePullSecrets: Secret names or {name: ...}, added to global.imagePullSecrets.
serviceAccountName: ""
imagePullSecrets: []

# Scheduling: applied to both the Portal pod and the Apache front door pod.
nodeSelector: {}
tolerations: []
affinity: {}
