{{- $cfg := include "egeria-portal.cfg" . | fromYaml -}}
{{- if $cfg.createDataClaim }}
# One volume, three sub-directories: state (~/.pyegeria), demo-data, and the Dr.Egeria inbox and outbox.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $cfg.dataClaim }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "portal") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
