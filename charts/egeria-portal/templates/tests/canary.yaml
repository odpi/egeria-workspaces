{{- $cfg := include "egeria-portal.cfg" . | fromYaml -}}
# helm test: proves the Portal through its front door, including a real Egeria call. Only the PASS line means ready.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $cfg.fullname }}-canary
  labels:
    app.kubernetes.io/name: portal-canary
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: egeria
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    {{- include "egeria-common.podSecurityContext" . | nindent 4 }}
  containers:
    - name: canary
      image: {{ $cfg.apacheImage }}
      imagePullPolicy: {{ .Values.images.apache.pullPolicy }}
      securityContext:
        {{- include "egeria-common.containerSecurityContext" . | nindent 8 }}
      env:
        - {name: FRONT, value: "http://{{ $cfg.webname }}:8085"}
        - {name: REDIRECT_OK, value: {{ $cfg.managedAuth | quote }}}
        {{- if $cfg.hasCanary }}
        - {name: CANARY_USER, valueFrom: {secretKeyRef: {name: {{ $cfg.canarySecretName }}, key: userId}}}
        - {name: CANARY_PASSWORD, valueFrom: {secretKeyRef: {name: {{ $cfg.canarySecretName }}, key: password}}}
        {{- end }}
      command:
        - python3
        - -c
        - |
          import http.client, json, os, sys, urllib.parse
          u = urllib.parse.urlparse(os.environ["FRONT"])
          def call(method, path, body=None, headers=None):
              c = http.client.HTTPConnection(u.hostname, u.port, timeout=120)
              c.request(method, path, body, headers or {})
              r = c.getresponse()
              return r.status, r.read()
          def need(ok, what):
              print(("ok:   " if ok else "FAIL: ") + what, flush=True)
              if not ok:
                  sys.exit(1)
          # freshstart's gate redirects /portal to its login page; quickstart serves it
          ok_codes = (200, 301, 302) if os.environ["REDIRECT_OK"] == "true" else (200,)
          s, _ = call("GET", "/portal")
          need(s in ok_codes, f"front door answers /portal (HTTP {s})")
          {{- if $cfg.hasCanary }}
          # Sign in as the canary account (non-personal), never with an empty body, which would mint the Portal's own token.
          body = json.dumps({"user_id": os.environ["CANARY_USER"], "password": os.environ["CANARY_PASSWORD"]})
          s, b = call("POST", "/api/egeria-token", body, {"Content-Type": "application/json"})
          need(s == 200, f"the canary account gets a bearer token from Egeria through the front door (HTTP {s})")
          need(bool(json.loads(b).get("token")), "the response carries a token")
          print("PASS: portal up, front door and Egeria token verified")
          {{- else }}
          print("FAIL: set canary.existingSecret (keys userId and password: a non-personal account that may sign in) so helm test can prove the Egeria call")
          sys.exit(1)
          {{- end }}
