{{- $cfg := include "egeria-portal.cfg" . | fromYaml -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $cfg.fullname }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "portal") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "egeria-common.selectorLabels" (dict "ctx" . "component" "portal") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# The front door: what the Ingress (or a port-forward) points at.
apiVersion: v1
kind: Service
metadata:
  name: {{ $cfg.webname }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "portal-web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "egeria-common.selectorLabels" (dict "ctx" . "component" "portal-web") | nindent 4 }}
  ports:
    - name: http
      port: 8085
      targetPort: http
