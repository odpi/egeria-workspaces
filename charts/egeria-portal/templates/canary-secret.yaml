{{- $cfg := include "egeria-portal.cfg" . | fromYaml -}}
{{- if $cfg.createCanarySecret }}
# DEMO ONLY: a non-personal account from the tracked public demo files (the same omagspcatnpa the platform canary uses).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.canarySecretName }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "portal") | nindent 4 }}
type: Opaque
data:
  userId: {{ "omagspcatnpa" | b64enc }}
  password: {{ .Files.Get (printf "files/%s/canary-password" .Values.environment) | trim | b64enc }}
{{- end }}
