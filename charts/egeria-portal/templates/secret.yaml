{{- $cfg := include "egeria-portal.cfg" . | fromYaml -}}
{{- if $cfg.createSecret }}
# DEMO ONLY (the production posture refuses to render without secrets.existingSecret).
# jwt-secret and mcp-access-token are random and kept across upgrades (lookup). The Egeria password is the public
# demo one from the tracked files (the same user the platform chart's demo posture creates).
{{- $existing := lookup "v1" "Secret" .Release.Namespace $cfg.secretName }}
{{- $jwt := randAlphaNum 48 | b64enc }}
{{- $mcp := randAlphaNum 32 | b64enc }}
{{- if $existing }}
{{- $jwt = default $jwt (get $existing.data "jwt-secret") }}
{{- $mcp = default $mcp (get $existing.data "mcp-access-token") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.secretName }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "portal") | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ $jwt }}
  mcp-access-token: {{ $mcp }}
  egeria-user-password: {{ .Files.Get (printf "files/%s/egeria-user-password" .Values.environment) | trim | b64enc }}
{{- end }}
