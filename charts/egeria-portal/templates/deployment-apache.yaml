{{- $cfg := include "egeria-portal.cfg" . | fromYaml -}}
{{- $v := .Values -}}
{{- $labels := include "egeria-common.labels" (dict "ctx" . "component" "portal-web") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $cfg.webname }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "egeria-common.selectorLabels" (dict "ctx" . "component" "portal-web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      annotations:
        checksum/conf: {{ include (print $.Template.BasePath "/configmap-apache.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- include "egeria-common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: apache
          image: {{ $cfg.apacheImage }}
          imagePullPolicy: {{ $v.images.apache.pullPolicy }}
          securityContext:
            {{- include "egeria-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8085
          resources:
            {{- toYaml $v.resources.apache | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - {name: conf, mountPath: /usr/local/apache2/conf/httpd.conf, subPath: httpd.conf, readOnly: true}
            - {name: conf, mountPath: /usr/local/apache2/conf/extra/fastapi-proxy.conf, subPath: fastapi-proxy.conf, readOnly: true}
            - {name: conf, mountPath: /usr/local/apache2/conf/extra/proxy-locations.conf, subPath: proxy-locations.conf, readOnly: true}
            - {name: logs, mountPath: /usr/local/apache2/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap:
            name: {{ $cfg.webname }}-conf
        - {name: logs, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
      {{- with $v.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
