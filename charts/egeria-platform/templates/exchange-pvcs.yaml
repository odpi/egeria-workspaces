{{- $cfg := include "egeria-platform.cfg" . | fromYaml -}}
{{- range $name, $x := .Values.exchange }}
{{- if and $x.enabled (not $x.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $cfg.fullname }}-{{ $name }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" $ "component" "platform") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.persistence.storageClassName }}
  storageClassName: {{ $.Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $x.size }}
{{- end }}
{{- end }}
