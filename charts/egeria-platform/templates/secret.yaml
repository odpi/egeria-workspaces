{{- $cfg := include "egeria-platform.cfg" . | fromYaml -}}
{{- if $cfg.createSecret }}
{{- /* Demo only (the chart refuses useDemoFiles in production): the tracked public demo files. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.secretName }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "platform") | nindent 4 }}
type: Opaque
data:
  {{- range $path, $_ := .Files.Glob (printf "files/%s/secrets/*" $.Values.environment) }}
  {{ base $path }}: {{ $.Files.Get $path | b64enc }}
  {{- end }}
{{- end }}
