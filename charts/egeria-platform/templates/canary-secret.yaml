{{- $cfg := include "egeria-platform.cfg" . | fromYaml -}}
{{- if $cfg.createCanarySecret }}
{{- /* Demo only: one non-personal account from the tracked public user directory. Its password is
       never printed; production uses canary.existingSecret. */}}
{{- $env := .Values.environment -}}
{{- $d := include "egeria-platform.envDefaults" $env | fromYaml -}}
{{- $dir := $.Files.Get (printf "files/%s/secrets/%s" $env (base $d.userDirectoryStore)) | fromYaml -}}
{{- $user := index $dir.secretsCollections $d.userDirectoryCollection "users" .Values.canary.demoUserId -}}
{{- if not $user -}}{{- fail (printf "canary.demoUserId %s is not in the demo user directory" .Values.canary.demoUserId) -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.canarySecretName }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "platform") | nindent 4 }}
type: Opaque
data:
  userId: {{ .Values.canary.demoUserId | b64enc }}
  password: {{ $user.secrets.clearPassword | b64enc }}
{{- end }}
