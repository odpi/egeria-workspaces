{{- $cfg := include "egeria-platform.cfg" . | fromYaml -}}
{{- if $cfg.createTlsSecret }}
{{- /* Demo only (production requires tls.existingSecret): the passwords of the image's built-in
       demo keystore, read from the tracked application.properties. */}}
{{- $props := .Files.Get (printf "files/%s/application.properties" .Values.environment) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.tlsSecretName }}
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "platform") | nindent 4 }}
type: Opaque
data:
  keystore-password: {{ include "egeria-platform.prop" (dict "name" "server.ssl.key-store-password" "props" $props) | b64enc }}
  truststore-password: {{ include "egeria-platform.prop" (dict "name" "server.ssl.trust-store-password" "props" $props) | b64enc }}
  key-alias: {{ include "egeria-platform.prop" (dict "name" "server.ssl.keyAlias" "props" $props) | b64enc }}
  rsa-key-id: {{ include "egeria-platform.prop" (dict "name" "rsa.key-id" "props" $props) | b64enc }}
{{- end }}
