{{- $cfg := include "egeria-platform.cfg" . | fromYaml -}}
{{- $env := .Values.environment -}}
{{- /* application.properties: the tracked compose file with only server.port and the
       placeholder variables replaced. No secrets are in it. */ -}}
{{- $props := .Files.Get (printf "files/%s/application.properties" $env) -}}
{{- $props = regexReplaceAllLiteral `(?m)^server\.port=.*$` $props (printf "server.port=%d" (int $cfg.port)) -}}
{{- $props = regexReplaceAllLiteral `(?s)platform\.placeholder\.variables=\\\n  \{.*?\n  \}` $props $cfg.placeholderBlock -}}
{{- if contains "host.docker.internal" $props -}}
{{- fail "internal error: host.docker.internal is still in the rendered application.properties" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cfg.fullname }}-properties
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "platform") | nindent 4 }}
data:
  application.properties: |
{{ $props | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cfg.fullname }}-configdocs
  labels:
    {{- include "egeria-common.labels" (dict "ctx" . "component" "platform") | nindent 4 }}
data:
  {{- range $s := $cfg.servers }}
  {{ $s }}.config: |
{{ $.Files.Get (printf "files/%s/servers/%s/%s.config" $env $s $s) | indent 4 }}
  {{- end }}
