# code-repo: components of a code repository from the files that declare them (manifests), with nested ones kept as PARTS of the
# enclosing component. It extends generic-relevance, so build output, installed packages and VCS internals are hidden, and a manifest
# inside such a subtree is never a component (hidden subtrees win). One claim per directory: the FIRST manifest rule below that matches.
# metadata.yaml is last on purpose: a directory that only carries metadata.yaml is a weaker claim (connector-style repos), and the
# Phase 0 manifest-probe baselines do not count it.
# 0.2.0 adds `manifest_reading` (below): where the recognizer is given a blob source it may read a short closed list of manifests for the members
# they declare. Without a source the profile behaves exactly as 0.1.0 (names and sizes only).
profile_id: code-repo
version: 0.4.0
status: proposed
applies_to: code-repo
extends: [generic-relevance]
roles: [component, other, tooling]
relevance:
  primary: [component]
  supporting: [other, tooling]
  hidden: []
rules:
  - id: R-comp-pyproject
    match: {has_file: pyproject.toml}
    assign: {role: component, kind: python-package}
    grain: component
    basis: manifest
    confidence: high
    evidence: "pyproject.toml declares a Python package or project"
  - id: R-comp-setup-py
    match: {has_file: setup.py}
    assign: {role: component, kind: python-package}
    grain: component
    basis: manifest
    confidence: high
    evidence: "setup.py declares a Python package"
  - id: R-comp-package-json
    match: {has_file: package.json}
    assign: {role: component, kind: node-package}
    grain: component
    basis: manifest
    confidence: high
    evidence: "package.json declares a Node package"
  - id: R-comp-pom
    match: {has_file: pom.xml}
    assign: {role: component, kind: maven-module}
    grain: component
    basis: manifest
    confidence: high
    evidence: "pom.xml declares a Maven module"
  - id: R-comp-gradle
    match: {has_file: build.gradle}
    assign: {role: component, kind: gradle-module}
    grain: component
    basis: manifest
    confidence: high
    evidence: "build.gradle declares a Gradle module"
  - id: R-comp-cargo
    match: {has_file: Cargo.toml}
    assign: {role: component, kind: rust-crate}
    grain: component
    basis: manifest
    confidence: high
    evidence: "Cargo.toml declares a Rust crate"
  - id: R-comp-go-mod
    match: {has_file: go.mod}
    assign: {role: component, kind: go-module}
    grain: component
    basis: manifest
    confidence: high
    evidence: "go.mod declares a Go module"
  - id: R-comp-helm-chart
    match: {has_file: Chart.yaml}
    assign: {role: component, kind: helm-chart}
    grain: component
    basis: manifest
    confidence: high
    evidence: "Chart.yaml declares a Helm chart"
  - id: R-comp-dockerfile
    match: {has_file: Dockerfile}
    assign: {role: component, kind: docker-image}
    grain: component
    basis: manifest
    confidence: medium
    evidence: "a Dockerfile builds an image; it may be a test fixture or a sub-image of a larger component"
  - id: R-comp-metadata-yaml
    match: {has_file: metadata.yaml}
    assign: {role: component, kind: connector-metadata}
    grain: component
    basis: manifest
    confidence: medium
    evidence: "metadata.yaml describes a connector or deployable unit that may carry no language manifest of its own"
manifest_reading:
  # The readers are a subset of the closed list in recognizer/manifests.py. A profile may tighten a cap, never raise it (defaults: 256 KiB per file,
  # 5,000 manifests and 64 MiB per survey). Lock files, .env files, data files and anything in a hidden subtree are never opened.
  readers: [package-json, pnpm-workspace, lerna, cargo, uv, go-work, maven, gradle]
  member_rule:
    id: M-workspace-member
    role: component
    kind: workspace-member
    basis: manifest-content
    confidence: high
    evidence: "a manifest of the repository names this directory as a member of its workspace or a module of its build (a Gradle include, with its projectDir mapping where there is one)"
    tuned_on: [trellis, datahub, superset, "iceberg (M8, spent)"]
  included_build_rule:
    id: M-included-build
    role: tooling
    kind: tooling-build
    basis: manifest-content
    confidence: medium
    evidence: "settings.gradle(.kts) names this directory in includeBuild(...): a composite build that supplies plugins and conventions to the main build is the repository's internal tooling, and so is every project below it. Known limit: a composite build that includes a real product build is mis-classed"
    tuned_on: ["kafka (N7, spent)"]
  aggregator_rule:
    id: M-aggregator
    role: other
    kind: workspace-aggregator
    basis: manifest-content
    confidence: high
    evidence: "this directory's manifest only aggregates its members (a package.json with workspaces, a pom with pom packaging, a virtual Cargo or uv workspace, a Gradle project whose only children are other included projects): the members are the components, not the aggregator"
    tuned_on: [trellis, datahub, superset, "iceberg (M8, spent)"]
path_grammar: []
name_grammar: []
