# worktree-copies: recognizes the working copies of other trees that pile up beside the real ones in a workspace of repositories.
# A name pattern is a stand-in for a duplicate-tree test (backlog), hence basis judgement and confidence low. Compose it LAST (see
# egeria-workspace): it must only claim files that no other rule claims, which is how the Phase 0 census counted worktree copies.
profile_id: worktree-copies
version: 0.1.0
status: proposed
applies_to: workspace-of-repos
roles: [worktree-copy]
relevance:
  primary: []
  supporting: []
  hidden: [worktree-copy]
rules:
  - id: R-copy-worktree-name
    match: {path_glob: ["wt-*/**", "ws-*/**", "ews-*/**", "trellis-wt*/**", "trellis-re-ui*/**", "*-vocab[0-9]*/**"]}
    assign: {role: worktree-copy, kind: tree-copy-by-name}
    grain: subtree
    basis: judgement
    confidence: low
    evidence: "a top-level folder named wt-*, ws-*, ews-*, trellis-wt*, trellis-re-ui* or *-vocab<N> is, by this workspace's convention, a working copy of another tree"
path_grammar: []
name_grammar: []
