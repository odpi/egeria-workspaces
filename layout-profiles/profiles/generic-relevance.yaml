# generic-relevance: the path-and-name rules of the Phase 0 census (a path-rule classifier), as a profile.
# It says what is NOT worth showing (build output, installed packages, VCS internals, runtime output, backups, copies of other trees).
# It names no component: that is the code-repo profile's job (M1). Everything these rules do not claim stays 'unclassified', which is a result.
# 0.3.0 adds four HIDDEN rules at the END (so no earlier rule's count can move): .claude/worktrees copies, .idea, logs under runtime-volumes,
# and a repository nested inside another repository. All four were found by the egeria-v6 stratified check (42 of 50 unclassified directories were junk).
# 0.4.0 (Dan's review, 2026-11-26): the build-output rule now needs corroboration to HIDE (a build manifest beside it, or no source-code file inside it); the name
# alone is a shown, low-confidence finding. Log and backup files are hidden as FILES only. A submodule that the outer .gitmodules declares is not a nested
# repository. Added: .ipynb_checkpoints, exchange-*/distribution-hub, and `private` folders inside certificate folders (role secret, by name only).
# The rules are ordered and the FIRST match wins. The order is the census's: .git, then installed/build directories, then file-name
# classes (events, dumps, logs, backups). The worktree-copy name pattern now lives in its own profile (worktree-copies, 0.1.0).
profile_id: generic-relevance
version: 0.4.0
status: proposed
applies_to: any
roles: [component, source, test, docs, config, generated, vendored, scratch, archive, audit,
        runtime-output, vcs-internal, worktree-copy, backup, secret, example, ci, tooling]
relevance:
  primary: [component]
  supporting: [source, test, docs, config, ci, tooling, example]
  hidden: [generated, vendored, scratch, archive, audit, runtime-output, vcs-internal, worktree-copy, backup, secret]
rules:
  - id: R-vcs-git
    match: {path_segment: .git}
    assign: {role: vcs-internal, kind: git-internals}
    grain: subtree
    basis: convention
    confidence: high
    evidence: ".git is the version-control directory of a repository; nothing in it is part of the repository's content"
  - id: R-vend-installed
    match: {path_segment: [node_modules, .venv, venv, site-packages, .tox, .gradle, .m2]}
    assign: {role: vendored, kind: installed-packages}
    grain: subtree
    basis: convention
    confidence: high
    evidence: "package-manager install, virtual-environment and dependency-cache directories hold other projects' code, restored from a manifest"
  - id: R-gen-build-output
    match: {name: [target, build, dist, .next], parent_has_file: [package.json, pom.xml, build.gradle, build.gradle.kts, settings.gradle, settings.gradle.kts, Cargo.toml, pyproject.toml, setup.py, setup.cfg, go.mod, CMakeLists.txt, Makefile, build.sbt, Gemfile, composer.json, Package.swift, tsconfig.json]}
    assign: {role: generated, kind: build-output}
    grain: subtree
    basis: convention
    confidence: medium
    evidence: "target, build, dist and .next are the usual names of build-tool output, and the directory beside them holds a build manifest that says there is something to build"
    tuned_on: ["Dan's review 2026-11-26"]
  - id: R-gen-build-output-no-source
    match: {name: [target, build, dist, .next], no_source_files: true}
    assign: {role: generated, kind: build-output}
    grain: subtree
    basis: convention
    confidence: medium
    evidence: "a directory named target, build, dist or .next with no source-code file anywhere below it holds build output; with no manifest beside it this is the only corroboration"
    tuned_on: ["Dan's review 2026-11-26"]
  - id: R-gen-build-output-unconfirmed
    match: {name: [target, build, dist, .next]}
    assign: {role: generated, relevance: supporting, kind: build-output-unconfirmed}
    grain: subtree
    basis: convention
    confidence: low
    evidence: "the name alone (target, build, dist, .next) is not enough to hide a folder: no build manifest beside it and source-code files inside it, so it may be a source folder; it is shown, with low confidence"
    tuned_on: ["Dan's review 2026-11-26"]
  - id: R-gen-tool-cache
    match: {path_segment: [__pycache__, .pytest_cache, .mypy_cache, .ruff_cache, .cache]}
    assign: {role: generated, kind: tool-cache}
    grain: subtree
    basis: convention
    confidence: high
    evidence: "interpreter and tool cache directories are rebuilt on demand"
  - id: R-run-openlineage-event
    match: {extension: .openlineageevent}
    assign: {role: runtime-output, kind: openlineage-event-file}
    grain: dir
    basis: convention
    confidence: high
    evidence: "an .openlineageevent file is one lineage event written by a running connector, not a source file"
  - id: R-run-heap-dump
    match: {extension: .hprof}
    assign: {role: runtime-output, kind: heap-dump}
    grain: dir
    basis: convention
    confidence: high
    evidence: ".hprof is the Java heap-dump format"
  - id: R-run-log
    match: {extension: .log}
    assign: {role: runtime-output, kind: log-file}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "a .log file is runtime output; a checked-in sample log would be misread. Only the matching FILES are hidden: one stray .log never hides its folder"
    tuned_on: ["Dan's review 2026-11-26"]
  - id: R-backup-dir
    match: {path_segment: db-backups}
    assign: {role: backup, kind: database-backup}
    grain: subtree
    basis: convention
    confidence: medium
    evidence: "a directory named db-backups holds database backups"
  - id: R-backup-file
    match: {extension: [.bak, .sql.gz, .dump]}
    assign: {role: backup, kind: backup-file}
    grain: dir
    basis: convention
    confidence: medium
    evidence: ".bak, .sql.gz and .dump are backup and dump file endings. Only the matching FILES are hidden: one stray .bak never hides its folder"
    tuned_on: ["Dan's review 2026-11-26"]
  - id: R-gen-ipynb-checkpoints
    match: {path_segment: .ipynb_checkpoints}
    assign: {role: generated, kind: notebook-checkpoints}
    grain: subtree
    basis: convention
    confidence: high
    evidence: ".ipynb_checkpoints holds the autosaved copies that Jupyter keeps beside a notebook"
    tuned_on: ["egeria-v6 re-check sample (be675143)"]
  - id: R-gen-distribution-hub
    match: {path_glob: ["exchange-*/distribution-hub/**", "**/exchange-*/distribution-hub/**"]}
    assign: {role: generated, kind: distribution-hub-output}
    grain: subtree
    basis: convention
    confidence: medium
    evidence: "the distribution-hub folder of an exchange-* folder holds what a running exchange publishes, not source"
    tuned_on: ["egeria-v6 re-check sample (be675143)"]
  - id: R-secret-private-in-cert-dir
    match: {name: private, parent_name_token: [cert, certificate, ca, pki]}
    assign: {role: secret, kind: private-key-folder}
    grain: subtree
    basis: convention
    confidence: medium
    evidence: "a folder named private inside a folder whose name has the whole word cert, certificate, ca or pki (any case; EgeriaRootCA is egeria, root, ca) holds private keys; recognized by name only, its files are never read"
    tuned_on: ["egeria-v6 re-check sample (be675143)"]
  - id: R-wt-claude-worktree
    match: {path_glob: [".claude/worktrees/*/**", "**/.claude/worktrees/*/**"]}
    assign: {role: worktree-copy, kind: claude-worktree}
    grain: subtree
    basis: convention
    confidence: high
    evidence: "each folder under .claude/worktrees is a working copy of the repository made for a session, whatever the copy is named"
    tuned_on: ["egeria-v6 stratified sample (6994dff1)"]
  - id: R-tool-idea
    match: {path_segment: .idea}
    assign: {role: tooling, relevance: hidden, kind: ide-settings}
    grain: subtree
    basis: convention
    confidence: high
    evidence: ".idea holds the settings that a JetBrains IDE keeps for a project, not part of the project"
    tuned_on: ["egeria-v6 stratified sample (6994dff1)"]
  - id: R-run-volume-logs
    match: {path_glob: ["runtime-volumes/logs/**", "runtime-volumes/**/logs/**", "**/runtime-volumes/logs/**", "**/runtime-volumes/**/logs/**"]}
    assign: {role: runtime-output, kind: runtime-volume-logs}
    grain: subtree
    basis: convention
    confidence: high
    evidence: "a logs folder under runtime-volumes holds what the running services wrote, whatever the files are called"
    tuned_on: ["egeria-v6 stratified sample (6994dff1)"]
  - id: R-vend-nested-repo
    match: {has_entry: .git, ancestor_has_entry: .git, path_glob: "**"}
    assign: {role: vendored, kind: nested-repository}
    grain: subtree
    basis: convention
    confidence: medium
    evidence: "a directory that holds its own .git (a folder or a worktree file) inside another repository, the scanned root included, is a vendored or copied repository, not part of the outer one; a repository that sits directly under a workspace root that is not itself a repository is not nested; a directory the outer repository's .gitmodules declares as a submodule is part of the outer repository and is not claimed"
    tuned_on: ["egeria-v6 stratified sample (6994dff1)"]
manifest_reading:
  readers: [gitmodules]
  submodule_rule: R-vend-nested-repo          # a directory the outer repository's .gitmodules declares (path entries only, never the url) is not claimed by this rule
path_grammar: []
name_grammar: []
