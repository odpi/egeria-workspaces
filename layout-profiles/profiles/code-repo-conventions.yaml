# code-repo-conventions: components that a manifest cannot find, by the conventional names and shapes of a code repository
# (docs, config, scripts, docker, tests, requirements, a root import package, a node package's src), and manifests under examples/ that are
# samples rather than components. Extends code-repo; its rules are checked FIRST, so a conventional name wins over a manifest in the same
# directory (docs/ that happens to hold a package.json is documentation), and an example wins over its manifest.
# Every rule here is basis: convention (or judgement) with its own evidence and a tuned_on note naming the tune-set repositories that motivated it
# (a rule motivated by one repository is suspect; ablate it). Tune set: trellis, datahub, superset only (scores provisional). The component rules are
# FROZEN as in 0.1.0; 0.2.0 adds only the file_roles layer below (path rules, no file content), which can neither change a component nor un-hide a file.
profile_id: code-repo-conventions
version: 0.10.0
status: proposed
applies_to: code-repo
extends: [code-repo]
roles: [component, example, fixture, test-support, tooling, source, test, docs, config, build, ci, other]
relevance:
  primary: [component]
  supporting: [example, fixture, test-support, tooling, source, test, docs, config, build, ci, other]
  hidden: []
rules:
  - id: R-conv-tests
    match: {path_glob: "*", name_regex: ['(?i)^(?:test|tests|testing|__tests__|testbed|testbeds|test-bed|test_bed|e2e|end-to-end|end2end|itest|itests)$|(?:_|-)tests$']}
    assign: {role: component, kind: test-suite}
    grain: component
    basis: convention
    confidence: medium
    evidence: "a top-level folder named test, tests, testing or __tests__, or ending in the PLURAL _tests or -tests (integration_tests, unit-tests), is the repository's test suite; it is checked BEFORE the fixture rule so only the manifest projects INSIDE it are excluded. Phase 1i I2: also testbed, testbeds, test-bed, test_bed, e2e, end-to-end, end2end, itest and itests (case-insensitive, whole name; a closed list, the same names as in R-fx-test-project). Known limit: other names (qa, compat) are not test suites"
    tuned_on: [superset, datahub, "Phase 1i I2 (Dan's ruling 2: more test-folder names; a closed list, not fitted to a repository)"]
  - id: R-conv-test-group
    match: {path_glob: "*", name_regex: ['(?i)(?:_|-)test$'], groups_projects: {min: 2, files: [pyproject.toml, setup.py, package.json, pom.xml, build.gradle, build.gradle.kts, Cargo.toml, go.mod, Chart.yaml, Dockerfile]}}
    assign: {role: component, kind: test-suite}
    grain: component
    basis: convention
    confidence: medium
    evidence: "a top-level folder whose name ends in the SINGULAR _test or -test, that is not itself a project (no manifest of its own, not a declared member) and that has more than one project below it (at least 2), groups the repository's tests: it is a test-suite, like a plural -tests folder, and the projects inside it are excluded (R-fx-test-group-project). A leaf project named ...-test is a package and is not touched. Known limit: a real product folder that groups two or more published test libraries would be excluded"
    tuned_on: ["spring-boot (D6, spent)"]
  - id: R-fx-test-project
    match: {segment_regex: ['(?i)^(?:test|tests|testing|__tests__|testfixtures|fixture|fixtures|testdata|test-data|testbed|testbeds|test-bed|test_bed|e2e|end-to-end|end2end|itest|itests)$|(?:_|-)tests$', '(?i)(?:^|[-_.])(?:test|tests|testing)[-_.]+\d[\d.]*(?:[-_.]?[a-z0-9]{1,6})?$', '(?i)^tests?[-_]'], child_segment_regex: {parent: [src], regex: ['^[a-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*Tests?$', '^tests?(?:[A-Z][a-z0-9]*)+$']}, has_file: [pyproject.toml, setup.py, package.json, pom.xml, build.gradle, build.gradle.kts, Cargo.toml, go.mod, Chart.yaml, Dockerfile]}
    assign: {role: fixture, kind: sample-project}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "a manifest project whose path has a test, tests, testing, __tests__, testFixtures, fixture(s), testdata or test-data segment (Phase 1i I2: or a testbed, testbeds, test-bed, test_bed, e2e, end-to-end, end2end, itest or itests segment, the names R-conv-tests gained), or one ending in the plural _tests or -tests, is a fixture (the singular -test and _test are not: a package may be named for a statistical test). Also: a test word (test, tests, testing) followed by a version or number tail (foo-tests-44, tests_2, integration-tests-3.7), and a segment that STARTS with test-, test_, tests- or tests_. Known limit, kept by Dan: a PUBLISHED test library named that way (a test-utils artifact) is excluded of the test suite, not a package of the repository. Also (F1): a camelCase TEST SOURCE SET, a segment whose PARENT segment is exactly src and whose name is camelCase ending in a capitalized Test or Tests (lower-case start), or starting with a lower-case test or tests followed by capitalized words; case-sensitive, no word list of prefixes. A project nested under it, or one whose own directory is the source set, is a fixture. Known limits: Maven's src/it is not matched (not camelCase); a source set without a test word (src/benchmarks) is not matched (src/e2e is matched since Phase 1i I2, by its e2e segment); a project under a Kotlin Multiplatform test source set (commonTest, jvmTest) is a fixture, as intended"
    tuned_on: [trellis, datahub, "iceberg (M8, spent)", "dagster (M8, spent)", "spring-boot (D6, spent)", "Phase 1i I2 (the same closed list of test-folder names as R-conv-tests)"]
  - id: R-fx-test-group-project
    match: {group_segment_regex: {min: 2, files: [pyproject.toml, setup.py, package.json, pom.xml, build.gradle, build.gradle.kts, Cargo.toml, go.mod, Chart.yaml, Dockerfile], regex: ['(?i)(?:_|-)test$']}, has_file: [pyproject.toml, setup.py, package.json, pom.xml, build.gradle, build.gradle.kts, Cargo.toml, go.mod, Chart.yaml, Dockerfile]}
    assign: {role: fixture, kind: sample-project}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "a manifest project below a folder whose name ends in the SINGULAR _test or -test, when that folder is not itself a project and has more than one project below it, is a test project, not a package of the repository (the folder groups tests). A leaf project that is itself named ...-test is not below such a folder and stays a component. Known limit: a folder that groups two or more published test libraries"
    tuned_on: ["spring-boot (D6, spent)"]
  - id: R-fx-sample-project
    match: {segment_regex: ['(?i)^(?:sample|samples|example|examples|template|templates|demo|demos)$'], has_file: [pyproject.toml, setup.py, package.json, pom.xml, build.gradle, build.gradle.kts, Cargo.toml, go.mod, Chart.yaml, Dockerfile]}
    assign: {role: example, kind: sample-project}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "a manifest project whose path has a sample(s), example(s), template(s) or demo(s) segment declares a sample, template or demo project, not a package of the repository"
    tuned_on: [trellis, datahub, "dagster (M8, spent)"]
  - id: R-fx-benchmark-project
    match: {segment_regex: ['(?i)^(?:benchmarks?|bench|jmh)$|^(?:benchmarks?|bench|jmh)[-_]|[-_](?:benchmarks?|bench|jmh)$'], has_file: [pyproject.toml, setup.py, package.json, pom.xml, build.gradle, build.gradle.kts, Cargo.toml, go.mod, Chart.yaml, Dockerfile]}
    assign: {role: test-support, kind: benchmark-project}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "a manifest project whose path has a benchmark, benchmarks, bench or jmh segment, or one starting or ending with one of them joined by - or _, is a benchmark harness: test support, not a package the repository ships"
    tuned_on: ["kafka (N7, spent)"]
  - id: R-fx-gradle-test-project
    match: {has_file: [build.gradle, build.gradle.kts], test_project: {name_words: [test, tests, testing], not_child_dir: src/main, other_than: [build.gradle, build.gradle.kts, settings.gradle, settings.gradle.kts, gradle.properties]}}
    assign: {role: fixture, kind: test-project}
    grain: dir
    file_scope: true
    basis: convention
    confidence: medium
    evidence: "a Gradle project (a directory holding build.gradle or build.gradle.kts, not the repository root) is an internal test project, not a component, when ALL of: a word of its directory name, split at - and _, is test, tests or testing (case-insensitive: x-codegen-test, x-protocol-test-codegen, test-x; not contest, attestation, latest-x); it has NO src/main folder (it ships no code); and it holds at least one file or folder other than build.gradle, build.gradle.kts, settings.gradle, settings.gradle.kts and gradle.properties (a project that is only a build file is a dependency starter or a BOM and stays a component). A Gradle project nested anywhere below such a project is one too, whatever its name. Names and folder presence only; no build file is opened. The test-folder and fixture rules above keep precedence. Its files keep their file roles (a file-role scope). Known limits: an internal test-support library WITH src/main (x-test-utils) stays a component; a test project that holds only its build file stays a component (it cannot be told from a starter)"
    tuned_on: ["Phase 1i I1-G (Dan's pick B; clause (c) added by the Architect against the starter ruling; the word list and the build-file list are closed lists, not fitted to a repository)"]
  - id: R-conv-docs
    match: {path_glob: [docs, doc, documentation], min_content: {files: [mkdocs.yml, mkdocs.yaml, docusaurus.config.js, docusaurus.config.ts, docusaurus.config.mjs, docusaurus.config.cjs, conf.py, antora.yml, book.toml, _config.yml, package.json, pom.xml, build.gradle, build.gradle.kts, Makefile], min_files: 2, extensions: [.md, .mdx, .rst, .adoc, .asciidoc, .txt, .ipynb]}}
    assign: {role: component, kind: documentation}
    grain: component
    basis: convention
    confidence: medium
    evidence: "a top-level docs, doc or documentation directory holds the repository's documentation ONLY when it holds a site or build configuration file (mkdocs.yml or .yaml, docusaurus.config.js/ts/mjs/cjs, conf.py, antora.yml, book.toml, _config.yml, package.json, pom.xml, build.gradle(.kts) or Makefile) directly or in a direct child folder (docs/source/conf.py), or at least 2 documentation files (.md, .mdx, .rst, .adoc, .asciidoc, .txt, .ipynb) anywhere below it; names only, no file is opened. The threshold of 2 is a judgement: a single notes file is not a documentation component. Otherwise the folder is not a component; its files are still classified and counted. Known limits: a site config deeper than one level below the folder is not seen (the folder is then judged by its documentation files); 2 notes make a component"
    tuned_on: [trellis, datahub, "Phase 1g G2 (minimum content; the file names and extensions are closed lists of documentation tools, not fitted to a repository)"]
  - id: R-conv-src-docs
    match: {path_glob: [src/docs, src/main/docs], min_content: {files: [mkdocs.yml, mkdocs.yaml, docusaurus.config.js, docusaurus.config.ts, docusaurus.config.mjs, docusaurus.config.cjs, conf.py, antora.yml, book.toml, _config.yml, package.json, pom.xml, build.gradle, build.gradle.kts, Makefile], min_files: 2, extensions: [.md, .mdx, .rst, .adoc, .asciidoc, .txt, .ipynb]}}
    assign: {role: component, kind: documentation}
    grain: component
    basis: convention
    confidence: medium
    evidence: "a documentation folder under the ROOT project's src, at exactly src/docs or src/main/docs (the Gradle and Maven convention for a guide, such as an Asciidoctor manual), holds the repository's documentation, with the SAME minimum-content test as R-conv-docs (a site or build configuration file directly in it or in a direct child folder, or at least 2 documentation files anywhere below it; names only, no file is opened). The component is that docs folder, not a child such as guide/. Repository root only: a src/main/docs inside a sub-project is not matched. Its files keep their file roles. Known limit: src/docs and src/main/docs are recognised at the repository root only"
    tuned_on: ["Phase 1i I3 (Dan's ruling 3: a documentation guide under src/main/docs counts as documentation; the two paths and the content lists are those of R-conv-docs, not fitted to a repository)"]
  - id: R-conv-config-lint
    match: {path_glob: [config, configs, conf], only_files: {child_dirs: ["checkstyle", "codenarc", "pmd", "spotbugs", "findbugs", "detekt", "ktlint", "spotless", "eslint", "stylelint", "prettier", "ruff", "flake8", "pylint", "mypy", "scalastyle", "scalafmt", "rubocop", "clang-format", "editorconfig", "codestyle"], names: ["checkstyle*.xml", "*suppressions*.xml", "codenarc*.xml", "pmd*.xml", "spotbugs*.xml", "findbugs*.xml", "detekt*.yml", "detekt*.yaml", "ruff.toml", ".ruff.toml", ".flake8", ".pylintrc", "pylintrc", "mypy.ini", ".eslintrc*", "eslint.config.*", ".prettierrc*", "prettier.config.*", ".stylelintrc*", "stylelint.config.*", ".rubocop.yml", ".scalafmt.conf", "scalastyle*.xml", ".clang-format", ".clang-tidy", ".editorconfig", ".golangci.yml", ".golangci.yaml", "tslint.json", "biome.json", "HEADER", "HEADER.txt", "*license-header*", "*license.header*", "*.license.*", "required-header.txt"]}}
    assign: {role: tooling, kind: lint-configuration}
    grain: dir
    file_scope: true
    basis: convention
    confidence: medium
    evidence: "a top-level config, configs or conf directory ALL of whose files (anywhere below it, names only) are linter or style configuration is the repository's own tooling, not a component: a file below a direct child folder named for a linter or formatter (checkstyle, codenarc, pmd, spotbugs, findbugs, detekt, ktlint, spotless, eslint, stylelint, prettier, ruff, flake8, pylint, mypy, scalastyle, scalafmt, rubocop, clang-format, editorconfig, codestyle), a linter or formatter configuration file by name (checkstyle*.xml, *suppressions*.xml, .eslintrc*, ruff.toml, .editorconfig, ...), or a license or file header template those tools use (HEADER, *license-header*, *.license.*, required-header.txt); closed lists, case-insensitive. Its files keep their file roles (it is a file-role scope). Otherwise R-conv-config applies. Known limits: a linter outside the lists makes its config/ a component; a config/ mixing linter files with even one other file stays a component"
    tuned_on: ["Phase 1h H2 (Dan's ruling: a linter/style-only config/ is tooling; the lists are closed lists of linters and formatters, not fitted to a repository)"]
  - id: R-conv-config
    match: {path_glob: [config, configs, conf]}
    assign: {role: component, kind: configuration}
    grain: component
    basis: convention
    confidence: medium
    evidence: "a top-level config, configs or conf directory holds the repository's configuration"
    tuned_on: [trellis]
  - id: R-conv-scripts
    match: {path_glob: "*", segment_regex: ['(?i)^scripts?$|^scripts?[-_]']}
    assign: {role: tooling, kind: maintenance-scripts}
    grain: dir
    file_scope: true
    basis: convention
    confidence: medium
    evidence: "a top-level directory named scripts or script, or starting scripts-, scripts_, script- or script_ (case-insensitive, whole segment), holds the repository's own maintenance scripts: it is tooling, not a component. Its files keep their file roles (it is a file-role scope, as a component directory is). Known limit: a scripts folder that is really a shipped package (a published CLI under scripts/) becomes tooling; names cannot tell the difference"
    tuned_on: [trellis, superset, "Phase 1h H1 (Dan's ruling: scripts/ is tooling; the name forms are a closed list, not fitted to a repository)"]
  - id: R-tool-package
    match: {segment_regex: ['(?i)^(?:tools|tooling|devtools|dev-tools|build-tools|buildsrc|_ext|scripts|script)$|^scripts?[-_]|^(?:\.github|\.circleci|\.buildkite|ci|\.ci|\.teamcity|\.gitlab|\.azure-pipelines|\.azuredevops|\.woodpecker|\.tekton|\.semaphore|\.jenkins)$'], has_file: [pyproject.toml, setup.py, package.json, pom.xml, build.gradle, build.gradle.kts, Cargo.toml, go.mod, Chart.yaml, Dockerfile]}
    assign: {role: tooling, kind: tooling-package}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "a package under a tools, tooling, devtools, dev-tools, build-tools, buildSrc, _ext, scripts or script folder (or one starting scripts-, scripts_, script- or script_, Phase 1h H1), or under a CI-configuration folder (the closed list shared with F-ci: .github, .circleci, .buildkite, ci, .ci, .teamcity, .gitlab, .azure-pipelines, .azuredevops, .woodpecker, .tekton, .semaphore, .jenkins), is the repository's own tooling, not a package it ships (a CI tool keeps its own build file there, such as a pom.xml for a Kotlin DSL)"
    tuned_on: [superset, "dagster (M8, spent)", "Phase 1g G1 (CI-configuration folders; the list is a closed list of CI services, not fitted to a repository)"]
  - id: R-conv-deployment
    match: {path_glob: [docker, deploy, deployment, k8s]}
    assign: {role: component, kind: deployment}
    grain: component
    basis: convention
    confidence: medium
    evidence: "a top-level docker, deploy, deployment or k8s directory holds container and deployment definitions"
    tuned_on: [trellis, superset]
  - id: R-conv-requirements
    match: {path_glob: [requirements]}
    assign: {role: component, kind: dependency-pins}
    grain: component
    basis: convention
    confidence: low
    evidence: "a top-level requirements directory holds the pinned dependency sets of a Python project that keeps them outside a manifest"
    tuned_on: [superset]
  - id: R-conv-root-import-package
    match: {path_glob: "*", has_file: __init__.py}
    assign: {role: component, kind: python-package}
    grain: component
    basis: judgement
    confidence: low
    evidence: "a top-level directory with an __init__.py is an importable Python package even where the manifest sits at the repository root"
    tuned_on: [superset]
  - id: R-ts-private-package
    match: {has_file: package.json, manifest_private: true, not_path_segment: [apps, app, applications, services, sites, website, web]}
    assign: {role: test-support, kind: private-package}
    grain: dir
    file_scope: true
    basis: manifest-content
    confidence: medium
    evidence: "a directory other than the repository root whose package.json (read from the git object database) has the top-level field private set to the boolean true is an internal package of the repository (a test harness, a private workspace package), not a component, UNLESS a whole segment of its path (its own name included, case-insensitive) is apps, app, applications, services, sites, website or web: a private application in a monorepo stays a component. Only the one boolean is read; the string \"true\", false or no field change nothing. Without manifest reading the rule never applies. Its files keep their file roles (a file-role scope). Known limits: a private package that is a real application outside those folder names (frontend/) becomes test-support; a published package marked private by mistake is excluded"
    tuned_on: ["Phase 1i I1 (Dan's ruling 1: internal test projects outside a top-level test folder are not components; the exempt folder names are a closed list, not fitted to a repository)"]
  - id: R-conv-node-src
    match: {path_glob: "*/src", parent_has_file: package.json, parent_not_role: [tooling]}
    assign: {role: component, kind: source-root}
    grain: component
    basis: judgement
    confidence: low
    evidence: "the src directory directly under a top-level folder that holds a package.json is that application's source root, the substantive part where the package.json is only a build wrapper; a src inside a nested package is part of that package, not a component. Not when the parent is claimed as tooling (Phase 1h H1: a tooling package and its parts are not components)"
    tuned_on: [superset]
file_roles:
  # The FILE-ROLE layer: every file that no rule above claimed (nothing hidden, no component rule) gets exactly one role from these path rules,
  # FIRST match wins, in the order of the Phase 1b brief: ci, test, docs, config, build, source, other. Names and paths only. `other` is a
  # classified result, reported beside the unclassified target, and is a catch-all the report must keep visible (flag it above 20%).
  # 0.3.0: the build rules (exact manifest names, Makefile, Dockerfile*, *.gradle*) come BEFORE the config extensions, so pyproject.toml, Cargo.toml and
  # Chart.yaml are `build`, not `config` (the brief's intent: a manifest is a build definition).
  - id: F-ci
    # G1 (0.8.0): the CI-configuration folders are ONE closed list, the same as the CI part of R-tool-package's segment list (a test checks they agree);
    # each is matched as a path SEGMENT at any depth (X/** and **/X/**), case-sensitive as before, EXCEPT the bare `ci`: top level only (ci/**), because a
    # non-dot ci deeper down is often a source package (.../java/org/x/ci/). R-tool-package still matches ci at any depth (it needs a manifest there).
    match: {path_glob: [".github/**", "**/.github/**", ".circleci/**", "**/.circleci/**", ".buildkite/**", "**/.buildkite/**", "ci/**", ".ci/**", "**/.ci/**", ".teamcity/**", "**/.teamcity/**", ".gitlab/**", "**/.gitlab/**", ".azure-pipelines/**", "**/.azure-pipelines/**", ".azuredevops/**", "**/.azuredevops/**", ".woodpecker/**", "**/.woodpecker/**", ".tekton/**", "**/.tekton/**", ".semaphore/**", "**/.semaphore/**", ".jenkins/**", "**/.jenkins/**", ".gitlab-ci.yml", "Jenkinsfile"]}
    assign: {role: ci, kind: ci-definition}
    grain: dir
    basis: convention
    confidence: high
    evidence: "CI service definitions live in a CI-configuration folder (.github, .circleci, .buildkite, .ci, .teamcity, .gitlab, .azure-pipelines, .azuredevops, .woodpecker, .tekton, .semaphore, .jenkins at any depth; ci at the top level only, since a ci folder deeper down is often a source package), in .gitlab-ci.yml and in a Jenkinsfile"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository", "Phase 1g G1 (the closed CI-folder list shared with R-tool-package)"]
  - id: F-test-dir
    match: {path_segment: [tests, test, __tests__]}
    assign: {role: test, kind: test-file}
    grain: dir
    basis: convention
    confidence: high
    evidence: "a file inside a folder named tests, test or __tests__ belongs to the test suite"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-test-maven
    match: {path_glob: ["src/test/**", "**/src/test/**"]}
    assign: {role: test, kind: test-file}
    grain: dir
    basis: convention
    confidence: high
    evidence: "src/test is the Maven and Gradle folder for tests"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-test-name
    match: {name_regex: ["^test_.*\\.py$", "_test\\.py$", "_test\\.go$", "\\.test\\.tsx?$", "\\.spec\\.tsx?$"]}
    assign: {role: test, kind: test-file}
    grain: dir
    basis: convention
    confidence: high
    evidence: "test_*.py, *_test.py, *_test.go, *.test.ts(x) and *.spec.ts(x) are the file names the language test runners collect"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-docs-folder
    match: {path_glob: ["docs/**", "doc/**"]}
    assign: {role: docs, kind: documentation-file}
    grain: dir
    basis: convention
    confidence: high
    evidence: "a file under the top-level docs or doc folder is documentation"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-docs-top-file
    match: {path_glob: ["*.md", "*.rst", "LICENSE*"]}
    assign: {role: docs, kind: documentation-file}
    grain: dir
    basis: convention
    confidence: high
    evidence: "a README, changelog or licence file at the top of the repository is documentation"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-docs-markup-anywhere
    match: {extension: [.md, .mdx, .rst]}
    assign: {role: docs, kind: documentation-file}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "a Markdown or reStructuredText file anywhere in a repository is written documentation (a README inside a package, a design note); the brief's top-level *.md / *.rst is the special case of this"
    tuned_on: [trellis, datahub, superset]
  - id: F-build-manifest
    match: {name: [package.json, package-lock.json, pyproject.toml, setup.py, setup.cfg, Cargo.toml, Cargo.lock, pom.xml, go.mod, go.sum, go.work, Chart.yaml, MANIFEST.in, Makefile, CMakeLists.txt, build.sbt, Gemfile, settings.gradle, settings.gradle.kts]}
    assign: {role: build, kind: build-definition}
    grain: dir
    basis: convention
    confidence: high
    evidence: "package manifests and make or build-tool definitions say how the component is built"
    tuned_on: ["brief 0335c236 (the manifests themselves), name list is the builder's, not fitted"]
  - id: F-build-docker
    match: {name_regex: ["^Dockerfile", "\\.gradle(\\.kts)?$", "^gradlew(\\.bat)?$"]}
    assign: {role: build, kind: build-definition}
    grain: dir
    basis: convention
    confidence: high
    evidence: "Dockerfile*, *.gradle and the Gradle wrapper scripts are build definitions"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-config-ext
    match: {extension: [.yaml, .yml, .toml, .ini, .cfg]}
    assign: {role: config, kind: configuration-file}
    grain: dir
    basis: convention
    confidence: medium
    evidence: "YAML, TOML, INI and CFG files are configuration"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-config-editorconfig
    match: {name: .editorconfig}
    assign: {role: config, kind: configuration-file}
    grain: dir
    basis: convention
    confidence: high
    evidence: ".editorconfig is editor configuration"
    tuned_on: ["brief 0335c236 (patterns), not fitted to a repository"]
  - id: F-config-component-dotfile
    match: {name_regex: "^\\.[^/]+$", component_scope: root}
    assign: {role: config, kind: configuration-file}
    grain: dir
