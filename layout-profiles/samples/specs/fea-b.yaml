# A second builder-written spec (A2): the other variants, and counts above one.
mutations:
  - class: off-grammar-case-name
    variant: wrong-case
  - class: off-grid-value
    variant: E
  - class: duplicate-combination
    variant: t
    count: 2
  - class: missing-input-deck
    count: 2
  - class: orphan-post
    count: 2
