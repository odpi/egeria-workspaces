#
# IPv6 overlay for egeria-freshstart's browser-facing ports.
# Applied automatically by fresh-start-local when --lan publishes the ports on
# every interface and the host has IPv6 (detect-engine.sh sets EGERIA_BIND_IP6
# -- see egeria_resolve_bind_ip6 there for the rules).
#
# The base files publish on ${EGERIA_BIND_IP}, which is an IPv4 address. A host
# name such as <machine>.local usually resolves to IPv6 addresses too, and a
# browser that picks one of those is refused, which shows up in the portal as
# an intermittent "network error". Compose appends these entries to each
# service's existing ports, so every port below answers on both.
#
# Not for use on its own: EGERIA_BIND_IP6 has no default here on purpose.
services:
  freshstart-jupyter-hub:
    ports:
      - "[${EGERIA_BIND_IP6:?set by fresh-start-local}]:7888:7888"

  freshstart-egeria-main:
    ports:
      - "[${EGERIA_BIND_IP6:?set by fresh-start-local}]:8443:8443"

  freshstart-pyegeria-web:
    ports:
      - "[${EGERIA_BIND_IP6:?set by fresh-start-local}]:7800:8000"

  freshstart-apache-web:
    ports:
      - "[${EGERIA_BIND_IP6:?set by fresh-start-local}]:7885:8085"
      - "[${EGERIA_BIND_IP6:?set by fresh-start-local}]:${HTTPS_PORT:-7843}:443"
