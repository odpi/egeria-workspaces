  Served by PyegeriaWebHandler at /resource-browser (resource_browser_handler.py).
  Phase 1: the Resource page (?guid=). Phase 2: Home, Search (L0) and Browse. Phase 3: work lists (?list=).

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resource Locator</title>
  <script src="/static/app-bar.js?v=2026-10-05a"></script>
  <script src="/static/bootstrap-banner.js?v=2026-08-18a"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* --dim is the dimmest text colour: keep it at or above 4.5:1 (WCAG AA) on --bg, --panel and --card in both themes. */
    :root {
      --bg: #080c14; --panel: #0b111c; --card: #0f1828; --hover: #131e30; --border: #1a2d48;
      --text: #c8d4e8; --muted: #a3abc0; --dim: #7088a2; --accent: #60a5fa;
      --abstract: #c4b5fd; --classif: #5eead4; --rel: #fbbf24; --base: #64748b;
      --md-code-bg: rgba(255,255,255,.08);
      --hub: #34d399; --product: #a78bfa; --known: #7a96b0; --warn: #fbbf24; --bad: #f87171;
    }
    :root.light {
      --bg: #f8fafc; --panel: #ffffff; --card: #f1f5f9; --hover: #e2e8f0; --border: #cbd5e1;
      --text: #1e293b; --muted: #475569; --dim: #5b6b80; --accent: #2563eb;
      --abstract: #7c3aed; --classif: #0d9488; --rel: #d97706; --base: #475569;
      --md-code-bg: rgba(0,0,0,.06);
      --hub: #059669; --product: #7c3aed; --known: #475569; --warn: #b45309; --bad: #dc2626;
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
           font-size: 14px; height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    input, textarea { outline: none; font-family: inherit; }
    input::placeholder, textarea::placeholder { color: var(--dim); }
    button { font-family: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    #root { display: flex; flex-direction: column; height: 100vh; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center;
              height: 100%; gap: 12px; color: var(--muted); }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent);
               border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .rb-scroll { flex: 1; overflow-y: auto; }
    .rb-page { max-width: 1080px; margin: 0 auto; padding: 22px 24px 60px; }
    .rb-crumb { font-size: 12px; color: var(--dim); margin-bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .rb-type { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
               border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
    .rb-title { font-size: 26px; font-weight: 700; line-height: 1.2; word-break: break-word; }
    .rb-qn { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); margin-top: 4px; word-break: break-all; }
    .rb-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .rb-badge { border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700;
                letter-spacing: .04em; text-transform: uppercase; border: 1px solid currentColor; }
    .rb-action { border: 1px solid var(--accent); color: var(--accent); background: transparent;
                 border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .rb-action:hover { background: rgba(96,165,250,.12); }
    .rb-attrib { font-size: 12px; color: var(--muted); }
    .rb-attrib b { color: var(--text); font-weight: 600; }
    .rb-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px;
               font-size: 11px; background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .rb-chip .k { color: var(--dim); }
    .rb-chip button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 12px; line-height: 1; }
    .rb-chip button:hover { color: var(--bad); }

    .rb-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
    @media (max-width: 860px) { .rb-grid { grid-template-columns: minmax(0, 1fr); } }
    .rb-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
    .rb-card h3 { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase;
                  letter-spacing: .07em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .rb-card h3 .rb-src { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
    .rb-absent { font-size: 12px; color: var(--dim); font-style: italic; }
    .rb-note { font-size: 11px; color: var(--dim); }
    .rb-src { font-size: 10px; color: var(--dim); }
    .rb-err { font-size: 12px; color: var(--bad); }
    .rb-desc { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .rb-edit { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 4px;
               font-size: 11px; padding: 1px 8px; cursor: pointer; }
    .rb-edit:hover { color: var(--text); border-color: var(--muted); }
    .rb-btn { border: none; border-radius: 4px; font-size: 12px; font-weight: 600; padding: 4px 12px; cursor: pointer;
              background: var(--accent); color: #fff; }
    .rb-btn.ghost { background: var(--hover); color: var(--muted); }
    .rb-btn:disabled { opacity: .5; cursor: default; }
    .rb-text { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px;
               color: var(--text); font-size: 13px; padding: 7px 9px; line-height: 1.5; resize: vertical; }
    .rb-text:focus { border-color: var(--accent); }

    table.rb-table { width: 100%; border-collapse: collapse; }
    .rb-table th { text-align: left; padding: 6px 8px; font-size: 10px; color: var(--dim); text-transform: uppercase;
                   letter-spacing: .06em; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap; }
    .rb-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); font-size: 12px; vertical-align: top; }
    .rb-table tr:last-child td { border-bottom: none; }
    .rb-mono { font-family: ui-monospace, monospace; }
    .rb-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 12px; }
    .rb-kv .k { color: var(--dim); }
    .rb-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: inherit; padding: 0; text-align: left; }
    .rb-link:hover { text-decoration: underline; }
    .rb-list { list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
    .rb-term { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px;
               padding: 1px 8px; font-size: 12px; background: var(--card); }
    .rb-term.ok { border-color: var(--accent); }
    .rb-term-status { font-size: 10px; color: var(--dim); }
    .rb-term-x { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 0 0 2px; }
    .rb-picker { min-width: 220px; }
    .rb-picks { margin-top: 6px; max-height: 220px; overflow-y: auto; }
    .rb-private { border-left: 3px solid var(--dim); padding-left: 8px; }
    .rb-part { display: flex; align-items: baseline; gap: 0; }
    .rb-detail { font-size: 11px; color: var(--dim); text-decoration: none; white-space: nowrap; }
    .rb-detail:hover { color: var(--accent); text-decoration: underline; }
    .rb-list .t { color: var(--dim); font-family: ui-monospace, monospace; font-size: 10px; margin-left: 6px; }

    .rb-nav { display: flex; gap: 4px; align-items: center; padding: 8px 24px; border-bottom: 1px solid var(--border);
              background: var(--panel); flex-shrink: 0; flex-wrap: wrap; }
    .rb-navtab { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 12px;
                 border-radius: 6px; cursor: pointer; }
    .rb-navtab:hover { color: var(--text); background: var(--hover); }
    .rb-navtab.on { color: var(--accent); background: var(--card); }
    .rb-search { flex: 1; min-width: 0; font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
                 background: var(--card); color: var(--text); }
    .rb-search:focus { border-color: var(--accent); }
    .rb-facet { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 999px;
                font-size: 12px; padding: 3px 11px; cursor: pointer; }
    .rb-facet:hover { color: var(--text); border-color: var(--muted); }
    .rb-facet.on { color: var(--accent); border-color: var(--accent); }
    .rb-select { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px;
                 font-size: 12px; padding: 3px 6px; }
    .rb-result { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-top: 8px; }
    .rb-result .n { font-weight: 600; font-size: 14px; }
    .rb-result .d { font-size: 12px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; }
    .rb-result .m { font-size: 11px; color: var(--dim); margin-top: 5px; gap: 12px; }
    .rb-result .m b { color: var(--muted); font-weight: 600; }
    .rb-pop { position: absolute; top: 26px; left: 0; z-index: 20; width: 300px; background: var(--panel);
              border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    @media (max-width: 600px) { .rb-pop { left: auto; right: -40px; width: min(300px, 86vw); } }
    .rb-kind { width: 18px; text-align: center; color: var(--muted); }
    .rb-values { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .rb-value { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--panel); color: var(--text);
                border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; cursor: pointer; position: relative; }
    .rb-value:hover { border-color: var(--accent); }
    .rb-value .n { font-weight: 600; font-size: 13px; padding-right: 36px; word-break: break-word; }
    .rb-value .c { position: absolute; top: 9px; right: 12px; font-size: 12px; color: var(--accent); }
    .rb-value.none { opacity: .55; cursor: default; }
    .rb-value.none .c { color: var(--dim); }
    @media (max-width: 600px) { .rb-nav { padding: 8px 16px; } .rb-page { padding: 16px 16px 48px; } }
  </style>
</head>

    <div class="center"><div class="spinner"></div><span>Loading the Resource Locator…</span></div>

var PAGE = window.location.pathname.indexOf('/resource-locator') === 0 ? '/resource-locator' : '/resource-browser';

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// fetch JSON through egeriaFetch (token-aware); rejects with the server's detail.
function getJson(url, creds, opts) {
  return egeriaFetch(url, creds, opts).then(function(r) {
    return r.json().catch(function() { return {}; }).then(function(d) {
      if (!r.ok) throw new Error((d && d.detail) || ('HTTP ' + r.status));

    body: body === undefined ? undefined : JSON.stringify(body) });
}

  var url = PAGE + '?guid=' + encodeURIComponent(guid);

}

  return el('button', { className: 'rb-link', title: item.typeName || '', onClick: function() { openResource(item.guid); } },

// ── Flavour (spec §3) ────────────────────────────────────────────────────────

function nextAction(res) {
  var f = res.flavour;

    return { label: 'Open the hub (' + f.via.hub[0].displayName + ')', run: function() { openResource(f.via.hub[0].guid); },

  if (f.flavour === 'product') {
    var p = f.via.product[0];
    if (p) return { label: 'Open the product (' + p.displayName + ')', run: function() { openResource(p.guid); },
