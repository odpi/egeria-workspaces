# apache/sites-available/fastapi-ssl.conf — freshstart
#
# Optional HTTPS VirtualHost — only activated when this file is mounted into
#   /usr/local/apache2/conf/extra/fastapi-ssl.conf
#
# Applied automatically by fresh-start-local via egeria-freshstart-ssl.yaml,
# which also mounts:
#   - ssl-define.conf   (runtime-generated; sets SSL_SERVER_NAME)
#   - /etc/ssl/egeria    (TLS certs from CERT_DIR — self-signed by default)
#
# Freshstart's proxy routes aren't shared via an Include (unlike quickstart's
# proxy-locations.conf) — this is a hand-mirrored copy of quickstart's
# <Location> blocks (quickstart's own fastapi-proxy.conf is redirect-only and
# has none). Keep the two in sync when adding a route to one — routes for
# features not yet ported to freshstart (egeria-insights, local-dashboards,
# my-egeria — see BACKLOG's SHARE-3 / task #23) are deliberately NOT mirrored
# here; adding a Location block for a route FastAPI doesn't serve just turns
# a clean 404 into a proxied one.
#
# SSL_SERVER_NAME is defined by ssl-define.conf, generated at deploy time from HOST_FQDN.
# The remaining paths are fixed inside the container (/etc/ssl/egeria/…).
Include conf/extra/ssl-define.conf

Define SSL_CERT_FILE   /etc/ssl/egeria/server.crt
Define SSL_KEY_FILE    /etc/ssl/egeria/server.key
Define SSL_CHAIN_FILE  /etc/ssl/egeria/server-ca.crt

LoadModule ssl_module             modules/mod_ssl.so
LoadModule socache_shmcb_module   modules/mod_socache_shmcb.so
LoadModule setenvif_module        modules/mod_setenvif.so

Listen 443

SSLSessionCache        shmcb:/usr/local/apache2/logs/ssl_scache(512000)
SSLSessionCacheTimeout 300

<VirtualHost *:443>
    ServerAdmin dan.wolfson@pdr-associates.com
    ServerName ${SSL_SERVER_NAME}

    SSLEngine on
    SSLCertificateFile    ${SSL_CERT_FILE}
    SSLCertificateKeyFile ${SSL_KEY_FILE}
    SSLCertificateChainFile ${SSL_CHAIN_FILE}

    DocumentRoot "/usr/local/apache2/htdocs"
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    RedirectMatch ^/$ /portal

    Alias /local /usr/local/apache2/htdocs/local
    <Directory "/usr/local/apache2/htdocs/local">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /docs /usr/local/apache2/htdocs/docs
    <Directory "/usr/local/apache2/htdocs/docs">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    <Location "/portal">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/portal
        ProxyPassReverse http://freshstart-pyegeria-web:8000/portal
        Require all granted
    </Location>

    <Location "/dr-egeria/process">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/dr-egeria/process
        ProxyPassReverse http://freshstart-pyegeria-web:8000/dr-egeria/process
        Require all granted
    </Location>

    <Location "/egeria-explorer">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/egeria-explorer
        ProxyPassReverse http://freshstart-pyegeria-web:8000/egeria-explorer
        Require all granted
    </Location>

    <Location "/tech-catalog">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/tech-catalog
        ProxyPassReverse http://freshstart-pyegeria-web:8000/tech-catalog
        Require all granted
    </Location>

    <Location "/egeria-audit">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/egeria-audit
        ProxyPassReverse http://freshstart-pyegeria-web:8000/egeria-audit
        Require all granted
    </Location>

    <Location "/egeria-overview">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/egeria-overview
        ProxyPassReverse http://freshstart-pyegeria-web:8000/egeria-overview
        Require all granted
    </Location>

    <Location "/egeria-operations">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/egeria-operations
        ProxyPassReverse http://freshstart-pyegeria-web:8000/egeria-operations
        Require all granted
    </Location>

    <Location "/lineage">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/lineage
        ProxyPassReverse http://freshstart-pyegeria-web:8000/lineage
        Require all granted
    </Location>

    <Location "/type-explorer">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/type-explorer
        ProxyPassReverse http://freshstart-pyegeria-web:8000/type-explorer
        Require all granted
    </Location>

    <Location "/login">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/login
        ProxyPassReverse http://freshstart-pyegeria-web:8000/login
        Require all granted
    </Location>

    <Location "/register">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/register
        ProxyPassReverse http://freshstart-pyegeria-web:8000/register
        Require all granted
    </Location>

    <Location "/reset-password">
        ProxyPreserveHost On
        ProxyPass http://freshstart-pyegeria-web:8000/reset-password
