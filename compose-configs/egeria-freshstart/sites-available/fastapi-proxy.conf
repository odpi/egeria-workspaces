# apache/sites-available/fastapi-proxy.conf — freshstart
#
# HTTP vhost — redirect-only. HTTPS (fastapi-ssl.conf, always mounted via
# egeria-freshstart-ssl.yaml) is the only vhost that actually serves content;
# this one exists purely so that old bookmarks/scripts hitting the plain-HTTP
# port don't dead-end.
#
# HTTPS_REDIRECT_PORT is defined by ssl-define.conf (runtime-generated from
# the current HTTPS_PORT), included via fastapi-ssl.conf earlier in httpd.conf.
#
# /.well-known/acme-challenge/ is exempted from the redirect, matching
# quickstart's vhost — harmless today (freshstart has no Let's Encrypt flow
# yet) and makes adding one later a config-only change.
<VirtualHost *:8085>
    ServerAdmin dan.wolfson@pdr-associates.com
    ServerName localhost:7885
    ServerAlias www.localhost

    Alias /.well-known/acme-challenge /usr/local/apache2/htdocs/.well-known/acme-challenge
    <Directory "/usr/local/apache2/htdocs/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://%{SERVER_NAME}:${HTTPS_REDIRECT_PORT}/$1 [L,R=301]

    ErrorLog /usr/local/apache2/logs/error.log
    CustomLog /usr/local/apache2/logs/access.log combined
</VirtualHost>
