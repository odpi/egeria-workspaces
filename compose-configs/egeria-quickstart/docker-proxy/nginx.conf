# Allow-list proxy in front of the host Docker socket for pyegeria-web.
#
# demo_reset_handler.py only needs to inspect, stop and start the Egeria
# platform container. Mounting /var/run/docker.sock into the internet-facing
# web app would let anyone who compromised it create a privileged container
# and own the host, so the app talks to this proxy instead, which forwards
# exactly those calls for exactly that container and refuses everything else.
#
# The container name is hardcoded below; keep it in step with
# EGERIA_CONTAINER_NAME (default quickstart-egeria-main).

# root is needed to open the socket (root:docker 0660); the proxy itself is
# reachable only on egeria_network and publishes no host port.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        # API version negotiation + connectivity check (docker SDK's ping()).
        location ~ ^(/v[0-9.]+)?/(_ping|version)$ {
            limit_except GET HEAD { deny all; }
            proxy_pass http://docker;
        }

        location ~ ^(/v[0-9.]+)?/containers/quickstart-egeria-main/json$ {
            limit_except GET { deny all; }
            proxy_pass http://docker;
        }

        location ~ ^(/v[0-9.]+)?/containers/quickstart-egeria-main/(start|stop)$ {
            limit_except POST { deny all; }
            # stop waits up to the requested timeout (60 s) for Egeria to exit.
            proxy_read_timeout 180s;
            proxy_pass http://docker;
        }

        location / {
            return 403;
        }
    }
}
