<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governance Metrics · Egeria</title>
<script src="/static/app-bar.js?v=2026-10-05a"></script>
<script src="/static/egeria-resize.js?v=2026-11-04b"></script>
<script>EgeriaResize.grids('.detail-grid');</script>
<script src="/static/bootstrap-banner.js?v=2026-08-18a"></script>
<script src="/static/diagram-viewer.js?v=2026-11-06a"></script>
<script src="/static/egeria-not-measured.js?v=2026-11-08a"></script>
<script src="/static/report-spec-source.js?v=2026-11-10a"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg:#1a1a2e; --card:#16213e; --card2:#12203c; --border:#0f3460;
    --accent:#e94560; --text:#e0e0e0; --muted:#a3abc0; --green:#4caf50; --amber:#f5b74e;
  }
  :root.light {
    --bg:#f5f6fa; --card:#ffffff; --card2:#eef1f7; --border:#d3d9e6;
    --accent:#d23353; --text:#1f2333; --muted:#5b6376; --green:#2e7d32; --amber:#b7791f;
  }
  :root.light .err { color:#b4233f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; }
  a { color:inherit; }

  .btn { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-size:.78rem; font-family:inherit; text-decoration:none; display:inline-block; }
  .btn:hover { background:var(--border); }

  .wrap { max-width:1100px; margin:0 auto; padding:22px 24px 60px; }
  .pagehead { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .pagehead h1 { font-size:1.35rem; font-weight:700; }
  .pagehead p { color:var(--muted); font-size:.85rem; margin-top:3px; max-width:70ch; }

  .badge { font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:20px; background:rgba(139,147,167,.16); color:var(--muted); display:inline-block; }
  .badge-live { background:rgba(76,175,80,.16); color:var(--green); }

  .metric-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:8px; }
  .metric-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; cursor:pointer; transition:border-color .15s; display:flex; flex-direction:column; gap:6px; }
  .metric-card:hover { border-color:var(--accent); }
  .metric-card h3 { font-size:1rem; font-weight:650; }
  .metric-card .desc { font-size:.8rem; color:var(--muted); line-height:1.4; flex:1; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .metric-card .meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px; }

  .empty { padding:40px 20px; text-align:center; color:var(--muted); border:1px dashed var(--border); border-radius:12px; margin-top:12px; }
  .err { padding:14px 16px; background:rgba(233,69,96,.1); border:1px solid rgba(233,69,96,.35); border-radius:8px; color:#ff9db1; font-size:.85rem; margin-top:12px; }

  .back { margin-bottom:14px; }
  .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
  @media (max-width:800px) { .detail-grid { grid-template-columns:1fr; } }
  .field { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .field .lab { font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:6px; }
  .field .val { font-size:.85rem; line-height:1.5; }
  .field .val code { background:var(--card2); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .field.full { grid-column:1 / -1; }

  .flow-panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-top:16px; }
  .flow-panel h3 { font-size:.9rem; margin-bottom:10px; }
  .mermaid-block { margin:10px 0; overflow-x:auto; }
  .mermaid-block svg { max-width:100%; }
  .p-note { font-size:.78rem; color:var(--muted); padding:8px 0; }

  .run-panel { margin-top:16px; }
  .run-out { background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-top:10px; font-size:.78rem; font-family:ui-monospace,monospace; white-space:pre-wrap; overflow-x:auto; max-height:340px; overflow-y:auto; }
  .loading { color:var(--muted); font-size:.85rem; padding:20px; text-align:center; }
  .eg-embedded #_bootstrap-banner { display:none !important; }
  .eg-embedded .wrap { padding-top:16px; }
</style>
</head>
<body>
<header class="eg-appbar eg-sticky" data-icon="🎯" data-title="Governance Metrics"
        data-subtitle="GovernanceMetric → GovernanceResults → Report lineage" data-feedback="governance-metrics">
  <div class="eg-appbar-extras"><a class="btn" href="/egeria-overview">📊 Overview Dashboard</a></div>
</header>
<script>
// Embedded as Egeria Audit's "Governance Metrics" tab (?embed=1): Audit's own app bar and
// bootstrap banner are already on screen, so drop this page's bar and banner.
if (/[?&]embed=1(&|$)/.test(location.search)) {
  document.documentElement.classList.add('eg-embedded');
  var _gmBar = document.querySelector('header.eg-appbar');
  if (_gmBar) _gmBar.remove();
}
</script>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script>
// Embedded in Egeria Audit (?embed=1): wait briefly for Audit's selected viewer, then read Egeria
// as that viewer (X-Egeria-Token). Standalone, or with no viewer, the Portal's service user reads.
var EMBEDDED = /[?&]embed=1(&|$)/.test(location.search);
var GM = { viewer: null, done: false, resolve: null };   // viewer: { token, userId, label } from Audit
var VIEWER = null;   // always GM.viewer; what the fetches and the note use

// What to do with a message from Audit (pure: tests/test_governance_metrics_viewer_js.py).
// Before the first load: take the viewer and start. After it (a late answer, or a new viewer):
// take it and reload, so the list, the note and later runs are all the same identity.
// Returns 'ignored' | 'first' | 'reload' | 'same'.
function gmReceiveViewer(gm, data, reload) {
  if (!data || data.type !== 'egeria-viewer') return 'ignored';
  var v = { token: data.token || '', userId: data.userId || '', label: data.label || '' };
  var changed = !gm.viewer || gm.viewer.token !== v.token || gm.viewer.label !== v.label;
  gm.viewer = v;
  if (!gm.done) { gm.done = true; if (gm.resolve) gm.resolve(); return 'first'; }
  if (changed) { reload(); return 'reload'; }
  return 'same';
}
// The 2 s wait ran out with no viewer: start as the service user (the note says so).
function gmTimeout(gm) {
  if (gm.done) return false;
  gm.done = true;
  if (gm.resolve) gm.resolve();
  return true;
}

var _viewerReady = new Promise(function(resolve){
  GM.resolve = resolve;
  if (!EMBEDDED || window.parent === window) { GM.done = true; resolve(); return; }
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || e.source !== window.parent) return;
    gmReceiveViewer(GM, e.data, function(){ VIEWER = GM.viewer; STATE.loaded = false; route(); fetchMetrics().then(route); });
    VIEWER = GM.viewer;
  });
  try { window.parent.postMessage({ type: 'egeria-viewer-request' }, location.origin); } catch (e) {}
  setTimeout(function(){ gmTimeout(GM); }, 2000);
});
function viewerHeaders(h){
  h = h || {};
  if (VIEWER && VIEWER.token) h['X-Egeria-Token'] = VIEWER.token;
  return h;
}
function viewerNote(){
  if (!EMBEDDED) return '';
  var who = (VIEWER && VIEWER.token)
    ? 'Shown as <b>' + esc(VIEWER.label || VIEWER.userId || 'the selected viewer') + '</b>, the viewer selected in Egeria Audit.'
    : "Shown as the Portal's service user: no viewer is selected in Egeria Audit (choose a persona or connect).";
  return '<div class="p-note" style="margin:-6px 0 8px">' + who + '</div>';
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var STATE = { metrics: [], loaded: false, error: null };

// Only the newest load may change the page (pure: tests/test_governance_metrics_viewer_js.py).
// A load started for an earlier viewer that answers after a newer one is dropped, so the
// service user's list can never land under the selected viewer's note.
function gmLoadTicket(gm) {
  gm.seq = (gm.seq || 0) + 1;
  var mine = gm.seq;
  return function isCurrent() { return gm.seq === mine; };
}

function fetchMetrics(){
  var current = gmLoadTicket(GM);
  return fetch('/api/governance-metrics', { headers: viewerHeaders() })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){ if (!current()) return; STATE.metrics = d.metrics || []; STATE.loaded = true; STATE.error = null; })
    .catch(function(e){ if (!current()) return; STATE.error = String(e); STATE.loaded = true; });
}

function route(){
  if (!STATE.loaded) { document.getElementById('app').innerHTML = '<div class="loading">Loading…</div>'; return; }
  var hash = location.hash.replace(/^#/, '');
  if (hash.startsWith('metric=')) {
    renderDetail(decodeURIComponent(hash.slice('metric='.length)));
  } else {
    renderList();
  }
}
window.addEventListener('hashchange', route);
window.addEventListener('egeria-theme-change', route);   // re-render diagrams in the new palette

function renderList(){
  var app = document.getElementById('app');
  if (!STATE.loaded) { app.innerHTML = '<div class="loading">Loading…</div>'; return; }
  if (STATE.error) {
    app.innerHTML = '<div class="pagehead"><h1>Governance Metrics</h1></div><div class="err">Failed to load: ' + esc(STATE.error) + '</div>';
    return;
  }
  var html = '';
  html += viewerNote();
  html += '<div class="pagehead"><div><h1>Governance Metrics <span class="badge badge-live">' + STATE.metrics.length + ' live</span></h1>';
  html += '<p>Each card is a real <code>GovernanceMetric</code> Egeria element (model 0450), linked via a real <code>GovernanceResults</code> relationship to the <code>Report</code> that computes it. This is Tier 1 of the lineage design — it stops at the Report; the analytic function and its data source aren\'t Egeria elements yet (see BACKLOG.md).</p></div></div>';
  if (!STATE.metrics.length) {
    html += '<div class="empty">No GovernanceMetric elements found. Run <code>OVERVIEW_GOVERNANCE_METRICS.dr-egeria.md</code> to create them.</div>';
  } else {
    html += '<div class="metric-grid">';
    STATE.metrics.forEach(function(m){
      html += '<div class="metric-card" data-metric-name="' + esc(m.name) + '">';
      html += '<h3>' + esc(m.name) + '</h3>';
      html += '<div class="desc">' + esc(m.summary || 'No summary set.') + '</div>';
      html += '<div class="meta">';
      html += m.report ? '<span class="badge badge-live">→ ' + esc(m.report.name) + '</span>' : '<span class="badge">no linked Report</span>';
      html += '</div></div>';
    });
    html += '</div>';
  }
  app.innerHTML = html;
}

function renderDetail(name){
  var app = document.getElementById('app');
  var m = STATE.metrics.find(function(x){ return x.name === name; });
  if (!m) { app.innerHTML = '<div class="back"><a class="btn" href="#">← All metrics</a></div><div class="empty">Metric not found.</div>'; return; }

  var html = '';
  html += '<div class="back"><a class="btn" href="#">← All metrics</a></div>';
  html += viewerNote();
  html += '<div class="pagehead"><div><h1>' + esc(m.name) + '</h1></div></div>';

  html += '<div class="detail-grid">';
  html += field('Summary', m.summary);
  html += field('Scope', m.scope);
  html += field('Measurement', m.measurement);
  html += field('Target', m.target);
  html += field('Usage', m.usage, true);
  html += field('Implementation Description', m.implementationDescription, true);
  html += '</div>';

  html += '<div class="flow-panel"><h3>Lineage</h3>';
  var mermaidId = 'flow-' + name.replace(/[^a-zA-Z0-9]/g, '_');
  if (m.report) {
    html += '<div id="' + mermaidId + '" class="mermaid-block"></div>';
    var code = buildFlowMermaid(m);
    setTimeout(function(){ renderMermaidBlock(mermaidId, code); }, 0);
  } else {
    html += '<div class="p-note">No GovernanceResults link found — this metric has no Report attached.</div>';
  }
  html += '</div>';

  if (m.report) {
    html += '<div class="run-panel"><button class="btn" data-run-spec="' + esc(m.report.reportSpec) + '">▶ Run \'' + esc(m.report.reportSpec) + '\' live</button>';
    html += '<div class="run-out" id="run-out" style="display:none"></div></div>';
  }

  app.innerHTML = html;
}

function field(label, value, full){
  return '<div class="field' + (full ? ' full' : '') + '"><div class="lab">' + esc(label) + '</div><div class="val">' + (value ? esc(value) : '<span style="color:var(--muted)">— not set —</span>') + '</div></div>';
}

function buildFlowMermaid(m){
  var lines = ['graph LR'];
  lines.push('  DS["Data source<br/>(not yet an Egeria element)"]');
  lines.push('  FN["Analytic function<br/>(not yet an Egeria element)"]');
  lines.push('  RPT["Report: ' + (m.report.name || '').replace(/"/g, "'") + '"]');
  lines.push('  GM["GovernanceMetric: ' + (m.name || '').replace(/"/g, "'") + '"]');
  lines.push('  DS -.-> FN -.-> RPT');
  lines.push('  RPT ==>|GovernanceResults| GM');
  var light = document.documentElement.classList.contains('light');
  lines.push(light ? '  classDef real fill:#ffffff,stroke:#2e7d32,color:#1f2333;'
                   : '  classDef real fill:#16213e,stroke:#4caf50,color:#e0e0e0;');
  lines.push(light ? '  classDef conceptual fill:#eef1f7,stroke:#5b6376,stroke-dasharray:3 3,color:#5b6376;'
                   : '  classDef conceptual fill:#12203c,stroke:#8b93a7,stroke-dasharray:3 3,color:#8b93a7;');
  lines.push('  class RPT,GM real;');
  lines.push('  class DS,FN conceptual;');
  return lines.join('\n');
}

function renderMermaidBlock(id, code){
  var tryRender = function(){
    if (!(window.mermaid && window.mermaid.render)) { setTimeout(tryRender, 150); return; }
    var el = document.getElementById(id);
    if (!el) return;
    try { window.mermaid.initialize({ startOnLoad: false, theme: document.documentElement.classList.contains('light') ? 'default' : 'dark', securityLevel: 'loose' }); } catch (e) {}
    window.mermaid.render(id + '-svg', code)
      .then(function(res){ var el2 = document.getElementById(id); if (el2) { el2.innerHTML = res.svg || ''; egeriaAttachExpand(el2, 'Diagram'); } })
      .catch(function(err){ var el2 = document.getElementById(id); if (el2) el2.innerHTML = '<div class="p-note">⚠ Mermaid render failed: ' + esc(String(err)) + '</div>'; });
  };
  tryRender();
}

function runReport(specName, btn){
  var out = document.getElementById('run-out');
  out.style.display = 'block';
  out.textContent = 'Running…';
  btn.disabled = true;
  // As the viewer when Audit gave one (X-Egeria-Token); otherwise as before.
  var runBody = (VIEWER && VIEWER.token)
    ? { spec_name: specName, server: 'qs-view-server', output_format: 'DICT' }
    : { spec_name: specName, server: 'qs-view-server', user_id: 'erinoverview', output_format: 'DICT' };
  fetch('/api/report-specs/execute', {
    method: 'POST', headers: viewerHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify(runBody),
  })
    .then(function(r){ return r.json(); })
    .then(function(d){ renderRunOutput(out, d); btn.disabled = false; })
    .catch(function(e){ out.textContent = 'Error: ' + String(e); btn.disabled = false; });
}

// kind:"absent" (ISSUE-171 / odpi/egeria-python #555): the value was not
// established or not measured — show that, not the raw envelope JSON. A
// result with `unmeasured` notes shows its nulls as "not measured" and lists
// each note underneath. Every other result: the same JSON text as before.
function renderRunOutput(out, d){
  var NM = window.EgeriaNotMeasured;
  // Where the spec that ran came from (same badge as Egeria Explorer's Report Specs view).
  var src = window.EgeriaSpecSource ? window.EgeriaSpecSource.blockHtml(d) : '';
  if (NM && NM.isAbsent(d)) { out.innerHTML = NM.absentHtml(d); if (src) out.insertAdjacentHTML('afterbegin', src); return; }
  var unmeasured = !!(NM && NM.hasUnmeasured(d));
  if (unmeasured && d.data === undefined) out.textContent = 'No results.';  // kind:"empty" — its notes follow
  else out.textContent = JSON.stringify(d.data !== undefined ? d.data : d, unmeasured ? NM.nullReplacer : null, 2);
  if (unmeasured) out.insertAdjacentHTML('beforeend', NM.footnoteHtml(d));
  if (src) out.insertAdjacentHTML('afterbegin', src);
}

// Event delegation for card clicks / run buttons — inline onclick="..."
// attributes previously broke here: JSON.stringify(m.name) embeds literal
// unescaped double-quotes directly inside an onclick="..." HTML attribute,
// which the HTML parser reads as the attribute's closing quote, truncating
// every handler (silently — no console error, the attribute just never
// contained the intended JS). data-* attributes + one delegated listener
// avoids the whole class of bug.
document.getElementById('app').addEventListener('click', function(e){
  var card = e.target.closest('[data-metric-name]');
  if (card) {
    location.hash = 'metric=' + encodeURIComponent(card.getAttribute('data-metric-name'));
    return;
  }
  var runBtn = e.target.closest('[data-run-spec]');
  if (runBtn) {
    runReport(runBtn.getAttribute('data-run-spec'), runBtn);
  }
});

_viewerReady.then(fetchMetrics).then(route);
</script>
</body>
</html>
