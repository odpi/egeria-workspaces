# Demo mode overlay for egeria-quickstart.
# Applied by ./quick-start-local --demo
#
# Activates DEMO_MODE (user registration/auth) on top of the HTTPS wiring
# that egeria-quickstart-ssl.yaml already applies on every run. In demo mode
# CERT_DIR must point to a real cert (see egeria-quickstart-ssl.yaml and
# PyegeriaWebHandler/demo-mode.md); quick-start-local --demo prompts for it
# and saves it to .env.demo. SITE_URL is written to .env by quick-start-local
# for both modes, so pyegeria-web/my-profile pick it up via the base file's
# ${SITE_URL} default — no override needed here.
services:
  pyegeria-web:
    environment:
      DEMO_MODE: "true"
      DEMO_DB_HOST: "host.docker.internal"
      # demo_reset_handler.py's scheduled reset (DEMO_MODE-gated) stops/starts
      # EGERIA_CONTAINER_NAME via the Docker API. It goes through docker-proxy
      # below rather than a /var/run/docker.sock mount: this app faces the
      # internet, and the raw socket is root on the host for whoever gets code
      # execution in it (see the 2026-10-17 Obsidian compromise).
      DOCKER_HOST: "tcp://docker-proxy:2375"
      # Workbench gate (workbench_access.py): JupyterLab and Obsidian are
      # reachable only via Apache's /jupyter/ and /obsidian/, and only by the
      # current Portal lock holder.
      WORKBENCH_GATE: "true"
      WORKBENCH_SECRET: "${WORKBENCH_SECRET:?WORKBENCH_SECRET must be set -- quick-start-local --demo generates it}"
      # Jupyter is on the isolated `workbench` network; its API is reached via
      # the gateway (pyegeria-web itself stays off that network).
      WORKBENCH_JUPYTER_INTERNAL_URL: "http://quickstart-workbench-gateway:7888/jupyter"
    volumes:
      - ../../runtime-volumes/quickstart-workbench-access:/app/workbench-access
    networks:
      - docker_control
    depends_on:
      - docker-proxy

  apache-web:
    environment:
      WORKBENCH_SECRET: "${WORKBENCH_SECRET:?WORKBENCH_SECRET must be set -- quick-start-local --demo generates it}"
    volumes:
      - ./sites-available/workbench-locations.conf:/usr/local/apache2/conf/extra/workbench-locations.conf:ro
      # A directory, not the file: the Portal replaces access.map by rename.
      - ../../runtime-volumes/quickstart-workbench-access:/usr/local/apache2/workbench-access:ro
    # Joins `workbench` to proxy /jupyter/ and /obsidian/ to it.
    networks:
      - workbench

  # ── Workbenches ─────────────────────────────────────────────────────────────
  # Both give whoever uses them code execution, and demo users are anyone who
  # registers, so in demo mode they are reached only through the gated Apache
  # routes above, use WORKBENCH_SECRET as their upstream credential (Apache
  # injects it; browsers never see it), and are capped so a session can't take
  # the whole machine (the 2026-10-17 miner did). Local mode is unaffected.
  jupyter-hub:
    command: ["start-notebook.py", "--ServerApp.base_url=/jupyter/"]
    environment:
      JUPYTER_TOKEN: "${WORKBENCH_SECRET:?WORKBENCH_SECRET must be set -- quick-start-local --demo generates it}"
    # Start as jovyan rather than root: JupyterLab already ran as jovyan (the
    # image's start script dropped privileges), and jovyan owns /opt/conda, so
    # `pip install --upgrade pyegeria` still works. Nothing in the container
    # runs as root now.
    user: "1000:100"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 4g
    pids_limit: 1024
    # Isolated: only Apache and the gateway share this network, and it has no
    # route out. No published ports (debugpy's 8889 included), and no
    # extra_hosts -- host.docker.internal/${HOST_FQDN} must resolve to the
    # gateway, not the host.
    networks: !override
      - workbench
    extra_hosts: !reset []
    ports: !reset []

  obsidian:
    environment:
      SUBFOLDER: "/obsidian/"
      CUSTOM_USER: "workbench"
      PASSWORD: "${WORKBENCH_SECRET:?WORKBENCH_SECRET must be set -- quick-start-local --demo generates it}"
    cpus: 2
    mem_limit: 3g
    pids_limit: 1024
    networks: !override
      - workbench
    ports: !reset []

  # The workbenches' only way out: forwards Egeria (9443), Unity Catalog
  # (8087), Kroki, the Obsidian plugin's MCP endpoint and PyPI, and nothing
  # else -- in particular not the shared Postgres, whose superuser password
  # is in a committed notebook. See workbench-gateway/nginx.conf.
  workbench-gateway:
    image: nginx:1.27-alpine
    container_name: quickstart-workbench-gateway
    restart: unless-stopped
    volumes:
      - ./workbench-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP:-host-gateway}"
    networks:
      egeria_network: {}
      workbench:
        aliases:
          - host.docker.internal
          - ${HOST_FQDN}
          - egeria-shared-kroki
          - pyegeria-web
          - pypi.org
          - files.pythonhosted.org
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Served to the internet as /my-egeria/ through Apache; the direct port
  # stays on loopback.
  my-profile:
    ports: !override
      - "127.0.0.1:8820:8020"

  # Allow-list proxy for the Docker socket: only inspect/stop/start of
  # quickstart-egeria-main and restart of obsidian-quickstart get through
  # (docker-proxy/nginx.conf). Publishes no host port.
  docker-proxy:
    image: nginx:1.27-alpine
    container_name: quickstart-docker-proxy
    restart: unless-stopped
    # Only pyegeria-web shares this network. On egeria_network the workbenches
    # could reach the proxy and stop Egeria.
    networks: !override
      - docker_control
    volumes:
      - ./docker-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # obsidian deliberately gets NO cert mount here. It used to receive
  # ${CERT_DIR}/server.key so :8861 served the real certificate, which made the
  # site's private key readable from inside a general-purpose desktop
  # container -- and it was, once that container was compromised (2026-10-17).
  # The image's own self-signed cert is fine for the loopback/tunnel access
  # the base file now defaults to.

networks:
  docker_control:
    name: quickstart_docker_control
    internal: true
  # Demo workbenches + Apache + workbench-gateway. internal: no route to the
  # host, the LAN or the internet; the gateway is the only way out.
  workbench:
    name: quickstart_workbench
    internal: true
