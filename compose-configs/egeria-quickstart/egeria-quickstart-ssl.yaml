# HTTPS overlay for egeria-quickstart's Apache front end.
# Applied by ./quick-start-local on every run (demo and non-demo alike) —
# see quick-start-local for how CERT_DIR/HTTPS_PORT get resolved:
#
#   --demo:      CERT_DIR must point to a real cert (server.crt, server.key,
#                server-ca.crt); prompted on first run, saved to .env.demo.
#   non-demo:    CERT_DIR defaults to a self-signed cert auto-generated by
#                generate-certs.sh into runtime-volumes/certs-quickstart on
#                first run (persisted in .env.ssl). Set CERT_DIR in
#                .env.ssl yourself to use a real cert instead.
#
# ssl-define.conf (sets Apache's SSL_SERVER_NAME to the current HOST_FQDN)
# is generated at runtime by quick-start-local and mounted from
# runtime-volumes/quickstart-apache-web/ssl-define.conf.
#
# WARNING (2026-08-23 incident): this file is an overlay, not the base
# config — apache-web's real definition only exists once this is merged
# with egeria-quickstart.yaml. A one-off `docker compose -f
# egeria-quickstart.yaml up -d apache-web` (e.g. to pick up a rebuilt
# image) recreates the container from ONLY the base file and silently
# drops the ssl-define.conf mount below — no error, Apache just falls
# back to an undefined ${HTTPS_REDIRECT_PORT}, so the plain-HTTP vhost's
# redirect sends browsers to a literal, unresolvable URL. Always pass the
# full file set (see quick-start-local's COMPOSE_FILES, or
# bin/update-pyegeria.sh's copy of that same logic) when touching
# apache-web directly, or just use quick-start-local/update-pyegeria.sh.
services:
  apache-web:
    ports:
      - "${HTTPS_PORT:-8843}:443"
    volumes:
      - ../../runtime-volumes/quickstart-apache-web/ssl-define.conf:/usr/local/apache2/conf/extra/ssl-define.conf
      - ./sites-available/fastapi-ssl.conf:/usr/local/apache2/conf/extra/fastapi-ssl.conf
      - ${CERT_DIR}:/etc/ssl/egeria:ro
