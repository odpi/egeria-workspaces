# Egress allow-list for the demo workbenches (JupyterLab, Obsidian).
#
# In demo mode the workbenches sit on `workbench`, an internal Docker network
# with no route anywhere (egeria-quickstart-demo.yaml). This gateway is the
# only other member besides Apache, and joins that network under the names
# the notebooks and the Obsidian plugin already use -- host.docker.internal,
# ${HOST_FQDN}, egeria-shared-kroki, pyegeria-web, pypi.org,
# files.pythonhosted.org -- so they resolve here. It forwards exactly the
# services below and nothing else: no shared Postgres (it holds the Portal's
# accounts), no Kafka, no host databases, no Ollama, no arbitrary internet.
#
# Upstreams are addressed by names the gateway itself does NOT alias
# (quickstart-egeria-main, kroki, quickstart-pyegeria-web), so its own DNS
# lookups go to the real containers rather than back to itself.

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

stream {
    log_format wb '$remote_addr [$time_local] :$server_port -> $upstream_addr '
                  '$status ${bytes_sent}B/${bytes_received}B ${session_time}s $ssl_preread_server_name';
    access_log /dev/stdout wb;
    # Docker's embedded DNS; re-resolved so a recreated container is found.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Egeria platform: https://host.docker.internal:9443 (and ${HOST_FQDN}).
    # TLS passes straight through.
    server {
        listen 9443;
        set $egeria quickstart-egeria-main:9443;
        proxy_pass $egeria;
    }

    # Unity Catalog (the clinical-trials notebooks): published on the host,
    # on a network of its own, so reached via the host gateway. Static
    # upstream, so the name comes from /etc/hosts (extra_hosts), which
    # Docker's DNS doesn't serve.
    upstream unity_catalog {
        server host.docker.internal:8087;
    }
    server {
        listen 8087;
        proxy_pass unity_catalog;
    }

    # JupyterLab's REST API, for pyegeria-web (workbench_access.py) to shut
    # down a departing user's kernels. pyegeria-web is not on `workbench`
    # itself: there it would be reachable without Apache's edge header,
    # which its demo login gate relies on. The API still needs the token.
    server {
        listen 7888;
        set $jupyter quickstart-jupyter-work-full:7888;
        proxy_pass $jupyter;
    }

    # PyPI, so `pip install --upgrade pyegeria` keeps working. TLS is not
    # terminated: the server name in the ClientHello picks the upstream, and
    # anything not on the list is refused. Public DNS here, because Docker's
    # would answer these names with this gateway's own address.
    map $ssl_preread_server_name $pypi_upstream {
        pypi.org                pypi.org:443;
        files.pythonhosted.org  files.pythonhosted.org:443;
        default                 127.0.0.1:1;
    }
    server {
        listen 443;
        ssl_preread on;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass $pypi_upstream;
    }
}

http {
    access_log /dev/stdout;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Port 8000 serves two names; Host decides.
    server {
        listen 8000 default_server;
        return 403;
    }

    # Self-hosted Kroki for render_mermaid() (EGERIA_KROKI_URL).
    server {
        listen 8000;
        server_name egeria-shared-kroki;
        location / {
            set $kroki http://kroki:8000;
            proxy_pass $kroki;
        }
    }

    # The Obsidian Call Dr. Egeria plugin's MCP endpoint
    # (mcpUrl http://pyegeria-web:8000/sse). Only the MCP paths -- nothing
    # else of pyegeria-web is reachable from a workbench.
    server {
        listen 8000;
        server_name pyegeria-web;
        location ~ ^/(sse|messages)(/|$) {
            set $pyegeria http://quickstart-pyegeria-web:8000;
            proxy_pass $pyegeria;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
        location / {
            return 403;
        }
    }
}
