        h1, h2, h3, h4, h5, h6 {

        h1 { font-size: 2em; }

        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;

        table, th, td {
            border: 1px solid #ddd;

        th, td {
            padding: 8px;
            text-align: left;

    <div id="content"></div>
    <script>
        // Text from the markdown file is put into the page as text, never as markup.
        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Initialize mermaid with enhanced configuration
        mermaid.initialize({
            startOnLoad: false, // Changed to false to manually control initialization
            theme: 'default',
            securityLevel: 'strict',
            logLevel: 'info', // Changed to info for more detailed logging
            fontFamily: 'monospace',
            flowchart: {
                curve: 'basis'
            },
            sequence: {
                diagramMarginX: 50,
                diagramMarginY: 10,
                actorMargin: 50,
                width: 150,
                height: 65
            },
            gantt: {
                titleTopMargin: 25,
                barHeight: 20,
                barGap: 4,
                topPadding: 50,
                leftPadding: 75
            }
        });

        // The viewer shows only markdown files from this site. A candidate must be a path on this
        // origin: no scheme, no host (including a leading "//"), no backslash or control character.
        // Returns the path (with any query), or null when the candidate is not accepted.
        function sameOriginPath(candidate) {
            if (typeof candidate !== 'string') return null;
            const s = candidate.trim();
            if (!s || s.length > 2048) return null;
            if (/[\\\u0000-\u001f\u007f]/.test(s)) return null;
            if (s.startsWith('//')) return null;
            if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return null;
            let u;
            try {
                u = new URL(s.startsWith('/') ? s : '/' + s, window.location.origin);
            } catch (e) {
                return null;
            }
            if (u.origin !== window.location.origin) return null;
            return u.pathname + u.search;
        }

        // Get the markdown file's path from the query parameter, the referrer or the viewer's own URL.
        // Returns { path } or { rejected } (the text that was not accepted).
        function getMarkdownUrl() {
            // Apache redirects /some/file.md to /markdown-viewer?url=/some/file.md
            const urlParams = new URLSearchParams(window.location.search);
            let mdUrl = urlParams.get('url');
            if (mdUrl) {
                try {
                    // Handle both encoded and non-encoded URLs
                    mdUrl = decodeURIComponent(mdUrl);
                } catch (e) {
                    console.error("Error decoding URL:", e);
                }
                const path = sameOriginPath(mdUrl);
                if (!path) return { rejected: mdUrl };
                // If the path doesn't end with .md, add it
                return { path: path.endsWith('.md') ? path : path + '.md' };
            }

            // A markdown page on this site that linked here
            try {
                const ref = document.referrer ? new URL(document.referrer) : null;
                if (ref && ref.origin === window.location.origin && ref.pathname.endsWith('.md')) {
                    return { path: ref.pathname };
                }
            } catch (e) {
                // not a usable referrer
            }

            // Fallback: the viewer's own path, with /markdown-viewer removed
            const own = window.location.pathname;
            if (own.includes('/markdown-viewer')) {
                const path = sameOriginPath(own.replace('/markdown-viewer', ''));
                if (path) return { path };
            }
            return { rejected: '' };
        }

        // Fetch the markdown content
        const target = getMarkdownUrl();
        const mdUrl = target.path || '';
        console.log("Fetching markdown from URL:", mdUrl);

        if (!target.path) {
            document.getElementById('content').innerHTML = `
                <h1>Cannot show this file</h1>
                <p>The markdown viewer shows only files on this site, given as a path such as /folder/file.md.</p>
                <p>Not accepted: <code>${escapeHtml(target.rejected)}</code></p>
            `;
        } else
        // Add a special header to bypass the rewrite rule
        fetch(mdUrl, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.text();
            })
            .then(text => {
                // Process markdown with mermaid diagrams
                const renderer = new marked.Renderer();
                const originalCodeRenderer = renderer.code;

                renderer.code = function(code, language) {
                    // marked 13 and later pass one token ({ text, lang }) instead of (code, language).
                    const token = (code && typeof code === 'object') ? code : null;
                    if (token) {
                        language = token.lang;
                        code = token.text;
                    }
                    console.log("Renderer.code called with language:", language);

                    // Handle both 'mermaid' and undefined language with mermaid content
                    if (language === 'mermaid' || 
                        (code && typeof code === 'string' && code.trim().match(/^(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram|erDiagram|gantt|pie|gitGraph)/))) {
                        try {
                            // Add a unique ID to each mermaid diagram
                            const diagramId = 'mermaid-diagram-' + Math.random().toString(36).substring(2, 15);
                            console.log("Found mermaid diagram with ID:", diagramId);
                            console.log("Mermaid code:", code);

                            // Clean up the code - remove any leading/trailing whitespace
                            // Ensure code is a string before calling trim()
                            const cleanCode = typeof code === 'string' ? code.trim() : String(code);

                            // Escaped, so that the diagram text reaches mermaid unchanged (mermaid reads textContent).
                            return `<div class="mermaid" id="${diagramId}">${escapeHtml(cleanCode)}</div>`;
                        } catch (error) {
                            console.error("Error rendering mermaid diagram:", error);
                            return `<div class="mermaid-error-container">
                                <div class="mermaid-error">
                                    <p>Error rendering mermaid diagram:</p>
                                    <pre>${escapeHtml(error.message)}</pre>
                                    <pre>${escapeHtml(code)}</pre>
                                </div>
                            </div>`;
                        }
                    }
                    return token ? originalCodeRenderer.call(this, token) : originalCodeRenderer.call(this, code, language);
                };

                // Set options for marked
                marked.setOptions({
                    renderer: renderer,
                    highlight: function(code, lang) {
                        // Log the language of code blocks to help with debugging
                        console.log("Code block with language:", lang);
                        if (lang === 'mermaid') {
                            console.log("Found mermaid code block in highlight function");
                        }
                        return code;
                    },
                    pedantic: false,
                    gfm: true,
                    breaks: false,
                    smartLists: true,
                    smartypants: false,
                    xhtml: false,
                    langPrefix: 'language-'  // Added to ensure proper language class is added
                });

                // Render markdown
                // marked does not sanitise its output; DOMPurify does, before it goes into the page.
                // Without DOMPurify the file is not shown.
                if (!window.DOMPurify || typeof window.DOMPurify.sanitize !== 'function') {
                    throw new Error('The HTML sanitiser (DOMPurify) did not load, so the file is not shown.');
                }
                document.getElementById('content').innerHTML = window.DOMPurify.sanitize(marked.parse(text));

                // Render mermaid diagrams with enhanced error handling
                console.log("Starting mermaid diagram rendering");

                // First, log all found mermaid diagrams
                const mermaidDiagrams = document.querySelectorAll('.mermaid');
                console.log(`Found ${mermaidDiagrams.length} mermaid diagrams`);

                // Render each diagram in turn, for error isolation. mermaid.render() with the element's own
                // unique id: separate mermaid.run() calls in the same millisecond reuse svg ids, and diagrams
                // then overwrite each other's content and styles.
                (async () => {
                    for (const [index, element] of Array.from(mermaidDiagrams).entries()) {
                        console.log(`Processing mermaid diagram ${index}:`, element.id);
                        const content = element.textContent;
                        try {
                            const { svg, bindFunctions } = await mermaid.render(element.id + '-svg', content);
                            element.innerHTML = svg;
                            if (bindFunctions) bindFunctions(element);
                            element.setAttribute('data-processed', 'true');
                        } catch (diagramError) {
                            element.textContent = content;
                            handleMermaidError(element, diagramError, index);
                        }
                    }
                })();

                // Helper function to handle mermaid errors consistently
                function handleMermaidError(element, error, index) {
                    console.error(`Error rendering mermaid diagram ${index}:`, error);
                    const originalContent = element.textContent;
                    element.innerHTML = `
                        <div class="mermaid-error">
                            <p>Error rendering mermaid diagram:</p>
                            <pre>${escapeHtml(error.message)}</pre>
                            <pre>${escapeHtml(originalContent)}</pre>
                        </div>
                    `;
                    element.classList.remove('mermaid');
                    element.classList.add('mermaid-error-container');
                }
            })
            .catch(error => {
                console.error("Error fetching or rendering markdown:", error);
                document.getElementById('content').innerHTML = `
                    <h1>Error Loading Markdown</h1>
                    <p>There was an error loading or rendering the markdown file:</p>
                    <pre>${escapeHtml(error.message)}</pre>
                    <p>URL attempted: ${escapeHtml(mdUrl)}</p>
                `;
            });
    </script>
