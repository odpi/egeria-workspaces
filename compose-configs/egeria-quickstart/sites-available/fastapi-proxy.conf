# apache/sites-available/fastapi-proxy.conf
#
# HTTP vhost — redirect-only. HTTPS (fastapi-ssl.conf, always mounted by
# quick-start-local/quick-start-multi-host via egeria-quickstart-ssl.yaml) is
# the only vhost that actually serves content; this one exists purely so that
# old bookmarks/scripts hitting the plain-HTTP port don't dead-end.
#
# HTTPS_REDIRECT_PORT is defined by ssl-define.conf (runtime-generated from
# the current HTTPS_PORT), included via fastapi-ssl.conf earlier in httpd.conf.
#
# /.well-known/acme-challenge/ is exempted from the redirect: Let's Encrypt's
# HTTP-01 validator must reach it over plain HTTP on port 80. Harmless when
# not using Let's Encrypt — the directory is simply never populated/requested.
<VirtualHost *:8085>
    ServerAdmin dan.wolfson@pdr-associates.com
    ServerName localhost:8885
    ServerAlias www.localhost

    Alias /.well-known/acme-challenge /usr/local/apache2/htdocs/.well-known/acme-challenge
    <Directory "/usr/local/apache2/htdocs/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://%{SERVER_NAME}:${HTTPS_REDIRECT_PORT}/$1 [L,R=301]

    ErrorLog /usr/local/apache2/logs/error.log
    CustomLog /usr/local/apache2/logs/access.log combined
</VirtualHost>
