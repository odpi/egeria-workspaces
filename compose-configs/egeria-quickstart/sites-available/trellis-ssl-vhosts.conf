# trellis-ssl-vhosts.conf — name-based HTTPS vhosts for the two trellis apps
#
# Resource Explorer and Egeria Advisor are separate containers that cannot be
# proxied at a sub-path of the portal: both serve root-absolute asset and API
# URLs (/static/..., /api/...) with no base-path setting, so mounting them at
# e.g. /resource-explorer/ collides head-on with the portal's own /static and
# /api Locations. They each need their own hostname, proxied root-to-root.
#
# Included from fastapi-ssl.conf, so this file is only ever read when HTTPS is
# enabled; Listen 443 and the SSL_CERT_FILE/SSL_KEY_FILE/SSL_CHAIN_FILE Defines
# come from there.
#
# Each vhost is guarded by <IfDefine> and stays inert until the matching Define
# appears in ssl-define.conf (generated by quick-start-local from
# EGERIA_RE_SERVER_NAME / EGERIA_ADVISOR_SERVER_NAME). Two things must be true
# before enabling one:
#
#   1. The hostname resolves publicly to this deployment.
#   2. The cert in CERT_DIR covers it — a wildcard (*.example.com) or an
#      explicit SAN. Apache will serve the wrong-name cert otherwise and every
#      browser will refuse the SSO handoff.
#
# NOTE: Apache resolves ProxyPass backends at startup. If trellis-re-web /
# trellis-ea-web are not running when httpd starts, startup FAILS with a DNS
# lookup error. Only define these names on a deployment where those containers
# are part of the stack.

<IfDefine RE_SERVER_NAME>
<VirtualHost *:443>
    ServerName ${RE_SERVER_NAME}

    SSLEngine on
    SSLCertificateFile      ${SSL_CERT_FILE}
    SSLCertificateKeyFile   ${SSL_KEY_FILE}
    SSLCertificateChainFile ${SSL_CHAIN_FILE}

    ProxyPreserveHost On
    <Location "/">
        ProxyPass        http://trellis-re-web:8810/ upgrade=websocket disablereuse=On retry=0
        ProxyPassReverse http://trellis-re-web:8810/
        Require all granted
    </Location>

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{Host}i"

    ErrorLog  /usr/local/apache2/logs/resource-explorer-error.log
    CustomLog /usr/local/apache2/logs/resource-explorer-access.log combined
</VirtualHost>
</IfDefine>

<IfDefine EA_SERVER_NAME>
<VirtualHost *:443>
    ServerName ${EA_SERVER_NAME}

    SSLEngine on
    SSLCertificateFile      ${SSL_CERT_FILE}
    SSLCertificateKeyFile   ${SSL_KEY_FILE}
    SSLCertificateChainFile ${SSL_CHAIN_FILE}

    ProxyPreserveHost On
    <Location "/">
        ProxyPass        http://trellis-ea-web:8880/ upgrade=websocket disablereuse=On retry=0
        ProxyPassReverse http://trellis-ea-web:8880/
        Require all granted
    </Location>

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{Host}i"

    ErrorLog  /usr/local/apache2/logs/egeria-advisor-error.log
    CustomLog /usr/local/apache2/logs/egeria-advisor-access.log combined
</VirtualHost>
</IfDefine>
