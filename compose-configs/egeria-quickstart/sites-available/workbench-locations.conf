# workbench-locations.conf — gated routes to JupyterLab and the Obsidian desktop
#
# Demo mode only: mounted by egeria-quickstart-demo.yaml and pulled into the
# HTTPS vhost by fastapi-ssl.conf's IncludeOptional. Without it (local mode)
# these paths don't exist and the workbenches keep their direct ports.
#
# Both workbenches give whoever reaches them code execution in a container,
# so a request only gets through if it carries the cookie the Portal set when
# that user acquired the session lock (PyegeriaWebHandler/workbench_access.py).
# The Portal publishes the current holder's key in access.map; mod_rewrite
# re-reads the file whenever it changes, so release/expiry/eviction take
# effect on the next request. WebSocket upgrades are ordinary requests here,
# so they are checked too.
#
# Upstream credentials (Jupyter token, Obsidian basic auth) are
# WORKBENCH_SECRET, injected here and never sent to the browser.

RewriteEngine On
RewriteMap workbench "txt:/usr/local/apache2/workbench-access/access.map"

# Forbid unless the request's wb_<app> cookie equals the map's key for <app>.
# The test string is "<all cookies>#<current key>"; the pattern finds
# wb_<app>=<64 hex> and back-references it against the text after '#'. A free
# lock maps to '-', which can never match. (The bare /jupyter and /obsidian
# just redirect to the slash form; the cookie's path only covers that.)
RewriteCond "%{HTTP_COOKIE}#${workbench:jupyter|-}" "!(?:^|;\s*)wb_jupyter=([0-9a-f]{64})(?:;[^#]*)?#\1$"
RewriteRule "^/jupyter/" - [F]

RewriteCond "%{HTTP_COOKIE}#${workbench:obsidian|-}" "!(?:^|;\s*)wb_obsidian=([0-9a-f]{64})(?:;[^#]*)?#\1$"
RewriteRule "^/obsidian/" - [F]

RedirectMatch ^/jupyter$ /jupyter/
<Location "/jupyter/">
    ProxyPreserveHost On
    ProxyPass        http://quickstart-jupyter-work-full:7888/jupyter/ upgrade=websocket disablereuse=On retry=0
    ProxyPassReverse http://quickstart-jupyter-work-full:7888/jupyter/
    RequestHeader set Authorization "token ${WORKBENCH_SECRET}"
    Require all granted
</Location>

RedirectMatch ^/obsidian$ /obsidian/
<Location "/obsidian/">
    ProxyPreserveHost On
    ProxyPass        http://obsidian-quickstart:3000/obsidian/ upgrade=websocket disablereuse=On retry=0
    ProxyPassReverse http://obsidian-quickstart:3000/obsidian/
    RequestHeader set Authorization "expr=Basic %{base64:workbench:${WORKBENCH_SECRET}}"
    Require all granted
</Location>
