services:
  proxy:
    image: egeria-shared-infra-proxy:latest
    pull_policy: never
    build:
      context: ../egeria-quickstart
      dockerfile: Dockerfile-proxy
    container_name: egeria-shared-openlineage-proxy-backend
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    networks:
      - egeria_network
    ports:
      - "6000:6000"
      - "6001:6001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - OPENLINEAGE_PROXY_CONFIG=/usr/src/app/proxy.yml
    volumes:
      - ../egeria-quickstart/usr/src/app/build/libs:/usr/src/app/build/libs
      - ../egeria-quickstart/proxy.yml:/usr/src/app/proxy.yml

  kafka:
    # Kafka runs on a pinned hardened image by default.
    image: "${SHARED_KAFKA_IMAGE}"
    container_name: egeria-shared-kafka
    hostname: egeria-shared-kafka
    networks:
      - egeria_network
    restart: always
    ports:
      - "9192:9192"
      - "9193:9193"
      - "9194:9194"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9193"
      KAFKA_CFG_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9192,CONTROLLER://0.0.0.0:9193,EXTERNAL://0.0.0.0:9194
      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        PLAINTEXT://egeria-shared-kafka:9192,CONTROLLER://127.0.0.1:9193,EXTERNAL://${HOST_FQDN}:9194
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
      KAFKA_CFG_LOG_DIRS: "${HARDENED_KAFKA_LOG_DIR}"
      # Logging and retention limits to prevent disk overflow
      KAFKA_CFG_LOG_RETENTION_HOURS: "24"
      KAFKA_CFG_LOG_RETENTION_BYTES: "536870912"
      KAFKA_CFG_LOG_SEGMENT_BYTES: "107374182"
      KAFKA_CFG_LOG_CLEANER_ENABLE: "true"
      KAFKA_CFG_LOG4J_ROOT_LOGLEVEL: "WARN"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'cat < /dev/null > /dev/tcp/127.0.0.1/9192'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - "${HARDENED_KAFKA_DATA_DIR}:/var/lib/kafka-data"

  postgres:
    # Postgres is also pinned via .env so updates are explicit.
    image: "${SHARED_POSTGRES_IMAGE}"
    container_name: egeria-shared-postgres
    restart: always
    networks:
      - egeria_network
    ports:
      - "5442:5442"
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: egeria
      PGDATA: /var/lib/postgresql/data/pgdata
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5442"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data/pgdata
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      # quickstart data files
      - ../../exchange-quickstart/coco-data-lake:/var/data/coco-data-lake
      - ../../exchange-quickstart/treasury-dts-history:/var/data/treasury-dts-history
    command: >-
      -p 5442
      -c max_connections=1000
      -c idle_in_transaction_session_timeout=1800000

  kroki:
    # Self-hosted Mermaid/diagram rendering, replacing pyegeria's previous
    # hardcoded dependency on the public https://kroki.io service (unreliable
    # under that service's own load — "Failed to launch the browser process"
    # crashpad crashes, plus Mermaid theme drift between requests). Jupyter
    # notebooks point EGERIA_KROKI_URL at this container; pyegeria's
    # render_mermaid() falls back to rendering client-side in the browser if
    # this container is absent or unreachable, so nothing hard-depends on it.
    image: yuzutech/kroki:latest
    container_name: egeria-shared-kroki
    restart: unless-stopped
    networks:
      - egeria_network
    ports:
      # Host-reachable, same reasoning as postgres's 5442 above — services
      # on egeria_network can already reach this via the container name
      # (http://egeria-shared-kroki:8000, used by egeria-freshstart/
      # egeria-quickstart), but host processes not on that network (e.g.
      # resource-explorer, run via `uv run` rather than containerized)
      # need a published port to reach it at all. Host side is 6002 (not
      # 8000) — 8000 is a very common local dev default (e.g. `mkdocs
      # serve`) and collided with it on this machine; container-internal
      # port stays 8000 (that's what KROKI_MERMAID_HOST/healthcheck/the
      # container-to-container EGERIA_KROKI_URL below all assume).
      - "6002:8000"
    environment:
      KROKI_MERMAID_HOST: kroki-mermaid
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - kroki-mermaid
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  kroki-mermaid:
    # Mermaid needs a real headless-browser renderer (same class of engine
    # kroki.io itself runs) — shm_size is the standard fix for Chromium's
    # "Failed to launch the browser process" crashpad crash under Docker's
    # default 64MB /dev/shm, same pattern already used for postgres above.
    image: yuzutech/kroki-mermaid:latest
    container_name: egeria-shared-kroki-mermaid
    restart: unless-stopped
    shm_size: 1gb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - egeria_network


volumes:
  shared_postgres_data:
    external: false

networks:
  egeria_network:
    driver: bridge
    name: egeria_network
    external: true

