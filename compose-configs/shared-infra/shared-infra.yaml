services:
  proxy:
    image: egeria-shared-infra-proxy:latest
    pull_policy: never
    build:
      context: ../egeria-quickstart
      dockerfile: Dockerfile-proxy
    container_name: egeria-shared-openlineage-proxy-backend
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    networks:
      - egeria_network
    ports:
      - "6000:6000"
      - "6001:6001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - OPENLINEAGE_PROXY_CONFIG=/usr/src/app/proxy.yml
    volumes:
      - ../egeria-quickstart/usr/src/app/build/libs:/usr/src/app/build/libs
      - ../egeria-quickstart/proxy.yml:/usr/src/app/proxy.yml

  kafka:
    # Kafka runs on a pinned hardened image by default.
    image: "${SHARED_KAFKA_IMAGE}"
    container_name: egeria-shared-kafka
    hostname: egeria-shared-kafka
    # The image's own entrypoint builds server.properties from a fixed heredoc
    # and substitutes only eight whitelisted KAFKA_CFG_* vars — every retention
    # and segment setting below was silently ignored, leaving the broker on
    # log.retention.hours=168 with 1 GB segments. That grew the audit-logs topic
    # to 14 GB and OOM-killed the broker on 2026-08-16. kafka-entrypoint.sh is a
    # drop-in replacement that keeps the stock formatting/format-guard behaviour
    # but honours these variables for real. See that file's header for detail.
    entrypoint: ["/usr/local/bin/egeria-kafka-entrypoint.sh"]
    networks:
      - egeria_network
    restart: always
    labels:
      # Opts this container in to the autoheal service below.
      egeria.autoheal: "true"
    ports:
      - "9192:9192"
      - "9193:9193"
      - "9194:9194"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9193"
      KAFKA_CFG_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9192,CONTROLLER://0.0.0.0:9193,EXTERNAL://0.0.0.0:9194
      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        PLAINTEXT://egeria-shared-kafka:9192,CONTROLLER://127.0.0.1:9193,EXTERNAL://${HOST_FQDN}:9194
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
      KAFKA_CFG_LOG_DIRS: "${HARDENED_KAFKA_LOG_DIR}"
      # Retention limits to prevent disk overflow. These are only effective
      # because of the entrypoint override above — the stock image ignores them.
      # Segment size matters as much as retention here: a segment is deleted
      # only once all of it has aged out, so the image's 1 GB default made 24 h
      # retention unable to reclaim anything in practice.
      KAFKA_CFG_LOG_RETENTION_HOURS: "24"
      KAFKA_CFG_LOG_RETENTION_BYTES: "536870912"
      KAFKA_CFG_LOG_SEGMENT_BYTES: "107374182"
      KAFKA_CFG_LOG_CLEANER_ENABLE: "true"
      # Heap. kafka-server-start.sh only falls back to -Xmx1G -Xms1G when this
      # is unset, and that 1 GB default is what ran out on 2026-08-16. Sized to
      # leave room for Egeria's EGERIA_MEM_LIMIT (6g) on the same host.
      KAFKA_HEAP_OPTS: "-Xmx3G -Xms3G"
      # Make an OutOfMemoryError kill the JVM instead of leaving it running with
      # a dead broker inside. That zombie state is exactly what happened on
      # 2026-08-16: the broker shut down, the process lived, so `restart: always`
      # never fired and nothing noticed for five days. With this flag the same
      # failure becomes a clean exit that the restart policy heals by itself.
      KAFKA_OPTS: "-XX:+ExitOnOutOfMemoryError"
      # NOTE: KAFKA_CFG_LOG4J_ROOT_LOGLEVEL and KAFKA_CFG_INTER_BROKER_LISTENER_NAME
      # are inert with this image (its entrypoint writes neither into
      # server.properties, and log4j is configured from its own file). Left
      # documented rather than set, so nobody re-adds them expecting an effect.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'cat < /dev/null > /dev/tcp/127.0.0.1/9192'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - "${HARDENED_KAFKA_DATA_DIR}:/var/lib/kafka-data"
      - ./kafka-entrypoint.sh:/usr/local/bin/egeria-kafka-entrypoint.sh:ro

  postgres:
    # Postgres is also pinned via .env so updates are explicit.
    image: "${SHARED_POSTGRES_IMAGE}"
    container_name: egeria-shared-postgres
    restart: always
    networks:
      - egeria_network
    ports:
      - "5442:5442"
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: egeria
      PGDATA: /var/lib/postgresql/data/pgdata
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5442"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data/pgdata
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      # quickstart data files
      - ../../exchange-quickstart/coco-data-lake:/var/data/coco-data-lake
      - ../../exchange-quickstart/treasury-dts-history:/var/data/treasury-dts-history
    command: >-
      -p 5442
      -c max_connections=1000
      -c idle_in_transaction_session_timeout=1800000

  kroki:
    # Self-hosted Mermaid/diagram rendering, replacing pyegeria's previous
    # hardcoded dependency on the public https://kroki.io service (unreliable
    # under that service's own load — "Failed to launch the browser process"
    # crashpad crashes, plus Mermaid theme drift between requests). Jupyter
    # notebooks point EGERIA_KROKI_URL at this container; pyegeria's
    # render_mermaid() falls back to rendering client-side in the browser if
    # this container is absent or unreachable, so nothing hard-depends on it.
    image: yuzutech/kroki:latest
    container_name: egeria-shared-kroki
    restart: unless-stopped
    networks:
      - egeria_network
    ports:
      # Host-reachable, same reasoning as postgres's 5442 above — services
      # on egeria_network can already reach this via the container name
      # (http://egeria-shared-kroki:8000, used by egeria-freshstart/
      # egeria-quickstart), but host processes not on that network (e.g.
      # resource-explorer, run via `uv run` rather than containerized)
      # need a published port to reach it at all. Host side is 6002 (not
      # 8000) — 8000 is a very common local dev default (e.g. `mkdocs
      # serve`) and collided with it on this machine; container-internal
      # port stays 8000 (that's what KROKI_MERMAID_HOST/healthcheck/the
      # container-to-container EGERIA_KROKI_URL below all assume).
      - "6002:8000"
    environment:
      KROKI_MERMAID_HOST: kroki-mermaid
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - kroki-mermaid
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  autoheal:
    # Restarts shared-infra containers labelled egeria.autoheal=true when their
    # healthcheck reports unhealthy while the container is still running —
    # the one failure mode Docker's `restart:` policies cannot see, because the
    # main process never exits. See autoheal/autoheal.sh for the full rationale
    # and the 2026-08-16 Kafka incident that motivated it.
    #
    # This is deliberately separate from the quickstart stack's watchdog, which
    # only observes `die` events and is torn down by every redeploy-demo run.
    build:
      context: ./autoheal
      dockerfile: Dockerfile-autoheal
    image: egeria-shared-autoheal:latest
    container_name: egeria-shared-autoheal
    restart: always
    # Same DNS-proxy pinning the quickstart watchdog uses, so api.resend.com
    # resolves reliably for alert emails.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      AUTOHEAL_LABEL: "egeria.autoheal"
      POLL_SECONDS: "30"
      RESTART_COOLDOWN_SECONDS: "600"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM: "${RESEND_FROM:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
    volumes:
      # Read-write, unlike the quickstart watchdog's :ro mount, because issuing
      # a restart is a write to the Docker API. Note the watchdog's :ro was
      # never a real restriction — :ro on a socket does not prevent API writes;
      # either way this grants effective control of the host's Docker daemon,
      # the standard tradeoff for any container that heals other containers,
      # and acceptable here on a single-user demo box.
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kroki-mermaid:
    # Mermaid needs a real headless-browser renderer (same class of engine
    # kroki.io itself runs) — shm_size is the standard fix for Chromium's
    # "Failed to launch the browser process" crashpad crash under Docker's
    # default 64MB /dev/shm, same pattern already used for postgres above.
    image: yuzutech/kroki-mermaid:latest
    container_name: egeria-shared-kroki-mermaid
    restart: unless-stopped
    shm_size: 1gb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - egeria_network


volumes:
  shared_postgres_data:
    external: false

networks:
  egeria_network:
    driver: bridge
    name: egeria_network
    external: true

