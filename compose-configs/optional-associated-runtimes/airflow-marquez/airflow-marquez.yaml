# Optimized for Airflow 3.3.2 | Toggleable OpenLineage (Marquez vs. Marquez+Egeria)
name: airflow-marquez

x-airflow-common: &airflow-common
  build: .
  image: airflow-egeria:3.3.1
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - .env
    - openlineage.env
  environment: &airflow-common-env
    AIRFLOW_UID: "50000"
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:${AIRFLOW_DATABASE_PASSWORD}@host.docker.internal:5442/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow_user:${AIRFLOW_DATABASE_PASSWORD}@host.docker.internal:5442/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: 'b-sqW-rmexFAOebsRs_o2sB3eXfHi1b1-0tMVhYWxdY='
    AIRFLOW__API_AUTH__JWT_SECRET: 'b-sqW-rmexFAOebsRs_o2sB3eXfHi1b1-0tMVhYWxdY='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8072/execution/'

    # --- OPENLINEAGE TOGGLE LOGIC ---
    AIRFLOW__OPENLINEAGE__DISABLED: 'false'
    AIRFLOW__OPENLINEAGE__NAMESPACE: 'egeria-workspace'
    # AIRFLOW__OPENLINEAGE__TRANSPORT (where the lineage events go) is set in openlineage.env, which
    # switch-lineage.sh rewrites - so the choice is kept in a file and survives restarts and rebuilds.

    AIRFLOW__API__PORT: "8072"
    # The scheduler's healthcheck (below) probes this server on 8974; Airflow 3 only starts it when enabled,
    # so without this the scheduler works but is reported "unhealthy" forever.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: '[{"name": "default-dags", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {"path": "/opt/airflow/dags"}}, {"name": "coco-dags", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {"path": "/opt/airflow/coco-dags"}}]'

    # Connections for the coco_feed_* and coco_subscriptions_* DAGs in coco-dags: the three Coco system databases
    # (read by the feeds, written by the subscription loads), the Data Sharing Hub the feeds fill - written as the
    # provisioner user that coco_data_hub's set-up creates - and the subscription staging area the loads read.
    AIRFLOW_CONN_COCO_PHARMA: 'postgres://airflow_user:${AIRFLOW_DATABASE_PASSWORD}@host.docker.internal:5442/coco_pharma'
    AIRFLOW_CONN_AUSTIN_SYSTEMS: 'postgres://airflow_user:${AIRFLOW_DATABASE_PASSWORD}@host.docker.internal:5442/austin_systems'
    AIRFLOW_CONN_BUCHAREST_SYSTEMS: 'postgres://airflow_user:${AIRFLOW_DATABASE_PASSWORD}@host.docker.internal:5442/bucharest_systems'
    AIRFLOW_CONN_COCO_DATA_HUB: 'postgres://provisioner:provisioner4egeria@host.docker.internal:5442/coco_data_hub'
    AIRFLOW_CONN_SUBSCRIPTION_STAGING: 'postgres://airflow_user:${AIRFLOW_DATABASE_PASSWORD}@host.docker.internal:5442/subscription_staging'

  volumes:
    - ${AIRFLOW_PROJ_DIR:-./runtime-data}/dags:/opt/airflow/dags
    - ../../../exchange-quickstart/coco-dags:/opt/airflow/coco-dags
    - ${AIRFLOW_PROJ_DIR:-./runtime-data}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./runtime-data}/plugins:/opt/airflow/plugins
  networks:
    - egeria_network

services:
  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - egeria_network

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8072:8072"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8072/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,coco-dags}
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config,coco-dags}
        /entrypoint airflow db migrate
        /entrypoint airflow fab users create --username airflow --password airflow --role Admin --firstname Airflow --lastname Admin --email airflow@example.com || true
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  marquez:
    image: marquezproject/marquez:latest
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - "5050:5050"
      - "5051:5051"
    environment:
      - MARQUEZ_PORT=5050
      - MARQUEZ_ADMIN_PORT=5051
      - MARQUEZ_CONFIG=/usr/src/app/marquez.yml
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5442
      - POSTGRES_DB=marquez
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SEARCH_ENABLED=false
    volumes:
      - ./marquez.yml:/usr/src/app/marquez.yml
    networks:
      - egeria_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5051/healthcheck"]
      interval: 10s

  marquez-web:
    image: marquezproject/marquez-web:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      - WEB_PORT=3000
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5050
    networks:
      - egeria_network
    depends_on:
      marquez:
        condition: service_healthy

networks:
  egeria_network:
    name: egeria_network
    external: true
