name: egeria-optional-prefect

# Resource Explorer's Prefect worker is in docker-compose.re-worker.yaml (its own file, so this server starts
# without the worker's service-account env file). See README §3.
services:
  prefect-server:
    image: prefecthq/prefect:3.8.6-python3.12
    container_name: egeria-optional-prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "${EGERIA_BIND_IP:-127.0.0.1}:4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect_user:user4prefect@egeria-shared-postgres:5442/prefect
      - PREFECT_UI_API_URL=http://localhost:4200/api
    networks:
      - egeria_network
    restart: always

networks:
  egeria_network:
    name: egeria_network
    external: true
